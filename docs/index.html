<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Inside TinyLlama — Libro interactivo</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #121722;
    --panel2: #0e1219;
    --line: #2a3344;
    --text: #e8ecf4;
    --muted: #8b95a8;
    --accent: #6ea8fe;
    --accent2: #a78bfa;
    --good: #3dd68c;
    --code-bg: #0a0e16;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #101522, #0b0d12);
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand h1 {
    margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em;
  }
  .brand .tag {
    color: var(--muted); font-size: 0.78rem; white-space: nowrap;
  }
  .header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .header-actions a, .header-actions button {
    text-decoration: none; color: var(--text); font-size: 0.8rem;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .header-actions a:hover, .header-actions button:hover {
    border-color: var(--accent); color: #fff;
  }
  /* Language selector */
  .lang-selector { position: relative; display: inline-block; }
  .lang-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
    color: var(--text); font-size: 0.8rem; font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--accent); }
  .lang-btn .flag { font-size: 1.1rem; }
  .lang-btn .arrow { font-size: 0.6rem; opacity: 0.6; }
  .lang-dropdown {
    display: none; position: absolute; top: calc(100% + 4px); right: 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px 0; min-width: 160px;
    z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .lang-dropdown.open { display: block; }
  .lang-option {
    display: flex; align-items: center; gap: 10px;
    width: 100%; border: 0; background: transparent;
    color: var(--text); padding: 8px 14px; cursor: pointer;
    font-size: 0.84rem; font-family: inherit; text-align: left;
  }
  .lang-option:hover { background: #1a2233; }
  .lang-option.active { color: var(--accent); font-weight: 600; }
  .lang-option .flag { font-size: 1.1rem; }
  .layout {
    flex: 1; display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 0;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside.sidebar {
      position: fixed; inset: 52px 0 auto 0; max-height: 50vh;
      z-index: 20; transform: translateY(-120%);
      transition: transform .2s; border-bottom: 1px solid var(--line);
    }
    aside.sidebar.open { transform: translateY(0); }
  }
  aside.sidebar {
    background: var(--panel2); border-right: 1px solid var(--line);
    overflow: auto; padding: 12px 0 24px;
  }
  .side-head {
    padding: 4px 14px 10px; color: var(--muted); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .nav-item {
    display: block; width: 100%; text-align: left;
    border: 0; background: transparent; color: var(--muted);
    padding: 8px 14px; cursor: pointer; font-size: 0.84rem;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: #161c28; color: var(--text); }
  .nav-item.active {
    background: #1a2233; color: #fff;
    border-left-color: var(--accent);
  }
  .nav-item .num {
    display: inline-block; min-width: 1.6em; color: var(--accent);
    font-variant-numeric: tabular-nums; font-weight: 650; margin-right: 6px;
  }
  .reader {
    overflow: auto; min-height: 0;
    scroll-behavior: smooth;
  }
  .reader-inner {
    max-width: 760px; margin: 0 auto; padding: 28px 22px 80px;
  }
  .progress {
    position: sticky; top: 0; z-index: 5; height: 3px; background: #151a24;
  }
  .progress > i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }
  article.markdown-body {
    line-height: 1.65; font-size: 1.02rem; color: #d7dce6;
  }
  article h1 {
    font-size: 1.75rem; line-height: 1.25; margin: 0 0 18px;
    color: #fff; letter-spacing: -0.02em;
  }
  article h2 {
    font-size: 1.25rem; margin: 2rem 0 0.75rem; color: #f0f3fa;
    border-bottom: 1px solid var(--line); padding-bottom: 0.35rem;
  }
  article h3 { font-size: 1.05rem; margin: 1.4rem 0 0.5rem; color: #c5d0e6; }
  article p { margin: 0.7rem 0; }
  article a { color: var(--accent); }
  article ul, article ol { padding-left: 1.35rem; }
  article li { margin: 0.3rem 0; }
  article blockquote {
    margin: 1rem 0; padding: 0.4rem 0 0.4rem 1rem;
    border-left: 3px solid var(--accent2); color: #b8c0d0;
  }
  article hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
  article table {
    border-collapse: collapse; width: 100%; margin: 1rem 0;
    font-size: 0.9rem; display: block; overflow-x: auto;
  }
  article th, article td {
    border: 1px solid var(--line); padding: 0.45rem 0.6rem; text-align: left;
  }
  article th { background: #161c28; color: #eef2ff; }
  article tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  article code {
    font-family: ui-monospace, Consolas, monospace; font-size: 0.88em;
    background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px;
    border: 1px solid #1c2433;
  }
  article pre {
    background: var(--code-bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; overflow-x: auto;
  }
  article pre code { border: 0; padding: 0; background: transparent; }
  .footer-nav {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--line);
  }
  .footer-nav button {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 12px 14px;
    cursor: pointer; text-align: left; font-size: 0.88rem;
  }
  .footer-nav button:hover { border-color: var(--accent); }
  .footer-nav button:disabled { opacity: 0.35; cursor: default; }
  .footer-nav .next { text-align: right; }
  .footer-nav .lbl { display: block; color: var(--muted); font-size: 0.72rem; margin-bottom: 2px; }
  .loading, .error { color: var(--muted); padding: 2rem 0; }
  .error { color: var(--hot, #ff6b8a); }
  .explore {
    margin: 1.25rem 0; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: #101522;
  }
  .explore h3 { margin: 0 0 8px; font-size: 0.85rem; color: var(--good); }
  .explore a {
    display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px;
    border-radius: 8px; background: #1a2233; border: 1px solid var(--line);
    color: var(--text); text-decoration: none; font-size: 0.8rem;
  }
  .explore a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <button type="button" id="btn-menu" title="Capítulos">☰</button>
    <div>
      <h1>Inside TinyLlama</h1>
      <div class="tag">Libro interactivo · proyecto Dreaming</div>
    </div>
  </div>
  <div class="header-actions">
    <a href="exploration/map_3d_orbit.html">Mapa 3D</a>
    <a href="exploration/universe_game.html">Juego</a>
    <a href="exploration/semantic_map.html">Áreas</a>
    <a href="exploration/archetype_map.html">Arquetipos</a>
    <a href="https://github.com/FiveTechSoft/dreaming/tree/main/inside-tinyllama" target="_blank" rel="noopener">GitHub</a>
    <div class="lang-selector">
      <button type="button" class="lang-btn" id="lang-btn" title="Idioma / Language">
        <span class="flag" id="lang-flag">🇪🇸</span>
        <span id="lang-label">ES</span>
        <span class="arrow">▾</span>
      </button>
      <div class="lang-dropdown" id="lang-dropdown">
        <button type="button" class="lang-option active" data-lang="es"><span class="flag">🇪🇸</span> Español</button>
        <button type="button" class="lang-option" data-lang="en"><span class="flag">🇬🇧</span> English</button>
        <button type="button" class="lang-option" data-lang="fr"><span class="flag">🇫🇷</span> Français</button>
        <button type="button" class="lang-option" data-lang="de"><span class="flag">🇩🇪</span> Deutsch</button>
        <button type="button" class="lang-option" data-lang="it"><span class="flag">🇮🇹</span> Italiano</button>
      </div>
    </div>
    <button type="button" id="btn-prev" title="Capítulo anterior (←)">←</button>
    <button type="button" id="btn-next" title="Capítulo siguiente (→)">→</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">Capítulos</div>
    <nav id="nav"></nav>
  </aside>
  <div class="reader" id="reader">
    <div class="progress"><i id="prog"></i></div>
    <div class="reader-inner">
      <div class="explore" id="explore-box">
        <h3>Exploración interactiva</h3>
        <a href="exploration/universe_game.html">▶ Universo-juego (capas + warp)</a>
        <a href="exploration/map_3d_orbit.html">▶ Mapa 3D (girar)</a>
        <a href="exploration/semantic_map.html">▶ Áreas semánticas</a>
        <a href="exploration/archetype_map.html">▶ Arquetipos</a>
      </div>
      <article class="markdown-body" id="content">
        <div class="loading">Cargando libro…</div>
      </article>
      <div class="footer-nav">
        <button type="button" id="foot-prev" disabled><span class="lbl">Anterior</span><span id="foot-prev-t">—</span></button>
        <button type="button" id="foot-next" class="next" disabled><span class="lbl">Siguiente</span><span id="foot-next-t">—</span></button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  const I18N = {
    es: { map3d:'Mapa 3D', game:'Juego', areas:'Áreas', archetypes:'Arquetipos', chapters:'Capítulos', explore_title:'Exploración interactiva', loading:'Cargando…', error_load:'No se pudo cargar el capítulo: ', error_json:'Error al cargar chapters.json', prev:'Anterior', next:'Siguiente' },
    en: { map3d:'3D Map', game:'Game', areas:'Areas', archetypes:'Archetypes', chapters:'Chapters', explore_title:'Interactive Exploration', loading:'Loading…', error_load:'Could not load chapter: ', error_json:'Error loading chapters.json', prev:'Previous', next:'Next' },
    fr: { map3d:'Carte 3D', game:'Jeu', areas:'Zones', archetypes:'Archétypes', chapters:'Chapitres', explore_title:'Exploration interactive', loading:'Chargement…', error_load:'Impossible de charger le chapitre : ', error_json:'Erreur de chargement', prev:'Précédent', next:'Suivant' },
    de: { map3d:'3D-Karte', game:'Spiel', areas:'Bereiche', archetypes:'Archetypen', chapters:'Kapitel', explore_title:'Interaktive Erkundung', loading:'Laden…', error_load:'Kapitel konnte nicht geladen werden: ', error_json:'Fehler beim Laden', prev:'Vorheriges', next:'Nächstes' },
    it: { map3d:'Mappa 3D', game:'Gioco', areas:'Aree', archetypes:'Archetipi', chapters:'Capitoli', explore_title:'Esplorazione interattiva', loading:'Caricamento…', error_load:'Impossibile caricare il capitolo: ', error_json:'Errore nel caricamento', prev:'Precedente', next:'Successivo' }
  };
  const LANG_INFO = { es:{flag:'🇪🇸',label:'ES'}, en:{flag:'🇬🇧',label:'EN'}, fr:{flag:'🇫🇷',label:'FR'}, de:{flag:'🇩🇪',label:'DE'}, it:{flag:'🇮🇹',label:'IT'} };

  const nav = document.getElementById('nav');
  const content = document.getElementById('content');
  const reader = document.getElementById('reader');
  const prog = document.getElementById('prog');
  const sidebar = document.getElementById('sidebar');
  let chapters = [], idx = 0;
  let currentLang = localStorage.getItem('book-lang') || 'es';

  marked.setOptions({ gfm: true, breaks: false });

  function applyI18n() {
    const t = I18N[currentLang] || I18N.es;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (t[k]) el.textContent = t[k];
    });
    const li = LANG_INFO[currentLang] || LANG_INFO.es;
    document.getElementById('lang-flag').textContent = li.flag;
    document.getElementById('lang-label').textContent = li.label;
    document.documentElement.lang = currentLang;
    document.querySelectorAll('.lang-option').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  }

  function numLabel(id, i) {
    if (id.startsWith('00')) return '0';
    const m = id.match(/^(\d+)/);
    return m ? String(parseInt(m[1], 10)) : String(i);
  }

  function renderNav() {
    nav.innerHTML = '';
    chapters.forEach((ch, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'nav-item' + (i === idx ? ' active' : '');
      b.innerHTML = '<span class="num">' + numLabel(ch.id, i) + '</span>' + escapeHtml(ch.short);
      b.onclick = () => loadChapter(i);
      nav.appendChild(b);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function rewriteLinks(html) {
    return html.replace(/href="([^"]+\.md)"/g, (all, file) => {
      const base = file.split('/').pop().replace(/\.md$/i, '');
      const j = chapters.findIndex(c => c.id === base || c.file === file.split('/').pop());
      if (j >= 0) return 'href="#/' + chapters[j].id + '" data-idx="' + j + '"';
      return all;
    });
  }

  function chaptersJsonPath() {
    return currentLang === 'es' ? 'chapters.json' : 'chapters_' + currentLang + '.json';
  }
  function chapterPath(ch) {
    return currentLang === 'es' ? 'chapters/' + encodeURIComponent(ch.file) : 'chapters_' + currentLang + '/' + encodeURIComponent(ch.file);
  }

  async function loadChapter(i, pushHash) {
    if (i < 0 || i >= chapters.length) return;
    idx = i; renderNav();
    const t = I18N[currentLang] || I18N.es;
    content.innerHTML = '<div class="loading">' + t.loading + '</div>';
    const ch = chapters[i];
    try {
      const res = await fetch(chapterPath(ch) + '?v=' + Date.now().toString(36).slice(-4));
      if (!res.ok) throw new Error(res.status);
      let html = marked.parse(await res.text());
      html = rewriteLinks(html);
      content.innerHTML = html;
      content.querySelectorAll('a[data-idx]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); loadChapter(Number(a.getAttribute('data-idx'))); }));
      content.querySelectorAll('a[href^="http"]').forEach(a => { a.target='_blank'; a.rel='noopener'; });
      reader.scrollTop = 0; updateFooter();
      if (pushHash !== false) history.replaceState(null, '', '#/' + ch.id);
      document.title = ch.short + ' · Inside TinyLlama';
      sidebar.classList.remove('open');
    } catch (e) {
      content.innerHTML = '<div class="error">' + t.error_load + escapeHtml(String(e.message||e)) + '</div>';
    }
  }

  function updateFooter() {
    const p = document.getElementById('foot-prev'), n = document.getElementById('foot-next');
    const bp = document.getElementById('btn-prev'), bn = document.getElementById('btn-next');
    p.disabled = bp.disabled = idx <= 0;
    n.disabled = bn.disabled = idx >= chapters.length - 1;
    document.getElementById('foot-prev-t').textContent = idx > 0 ? chapters[idx-1].short : '—';
    document.getElementById('foot-next-t').textContent = idx < chapters.length-1 ? chapters[idx+1].short : '—';
  }

  function go(d) { loadChapter(Math.max(0, Math.min(chapters.length-1, idx+d))); }

  document.getElementById('foot-prev').onclick = () => go(-1);
  document.getElementById('foot-next').onclick = () => go(1);
  document.getElementById('btn-prev').onclick = () => go(-1);
  document.getElementById('btn-next').onclick = () => go(1);
  document.getElementById('btn-menu').onclick = () => sidebar.classList.toggle('open');

  reader.addEventListener('scroll', () => { const m=reader.scrollHeight-reader.clientHeight; prog.style.width = m>0 ? (reader.scrollTop/m)*100+'%' : '0%'; });
  window.addEventListener('keydown', e => { if(e.target.matches('input,textarea'))return; if(e.key==='ArrowLeft')go(-1); if(e.key==='ArrowRight')go(1); if(e.key==='Escape')sidebar.classList.remove('open'); });

  function idxFromHash() { const h=(location.hash||'').replace(/^#\/?/,''); if(!h)return 0; const j=chapters.findIndex(c=>c.id===h||c.file===h||c.file===h+'.md'); return j>=0?j:0; }
  window.addEventListener('hashchange', () => { const j=idxFromHash(); if(j!==idx)loadChapter(j,false); });

  /* Language selector */
  const langBtn = document.getElementById('lang-btn');
  const langDrop = document.getElementById('lang-dropdown');
  langBtn.addEventListener('click', e => { e.stopPropagation(); langDrop.classList.toggle('open'); });
  document.addEventListener('click', () => langDrop.classList.remove('open'));
  langDrop.addEventListener('click', e => e.stopPropagation());
  document.querySelectorAll('.lang-option').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.lang === currentLang) return;
      currentLang = b.dataset.lang;
      localStorage.setItem('book-lang', currentLang);
      langDrop.classList.remove('open');
      applyI18n();
      boot();
    });
  });

  async function boot() {
    try {
      const res = await fetch(chaptersJsonPath());
      if (!res.ok) throw new Error('chapters.json');
      chapters = await res.json();
      renderNav(); applyI18n();
      loadChapter(idxFromHash(), false);
    } catch (e) {
      content.innerHTML = '<div class="error">' + (I18N[currentLang]||I18N.es).error_json + '</div>';
    }
  }
  boot();
})();
</script>
</body>
</html>
