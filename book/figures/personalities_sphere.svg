<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="600" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">
    ¿Cuántas Personalidades Tiene un LLM?
  </text>
  <text x="600" y="65" text-anchor="middle" fill="#FFD700" font-size="14" font-family="Arial">
    "¿Cuántas direcciones hay en el manifold de significado?"
  </text>
  
  <!-- ==================== RESPUESTA ==================== -->
  <g transform="translate(600, 150)">
    <rect x="-500" y="-40" width="1000" height="100" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-10" text-anchor="middle" fill="#FFD700" font-size="18" font-weight="bold">
      Respuesta: Infinitas, pero no todas son distintas
    </text>
    
    <text x="0" y="20" text-anchor="middle" fill="#aaa" font-size="12">
      En un espacio continuo hay infinitas direcciones, pero las personalidades se AGRUPAN en familias
    </text>
  </g>
  
  <!-- ==================== VISUALIZACIÓN: ESFERA ==================== -->
  <g transform="translate(350, 400)">
    <text x="0" y="-180" text-anchor="middle" fill="#4ECDC4" font-size="16" font-weight="bold">
      La Esfera de Personalidades
    </text>
    
    <!-- Esfera grande -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Familias de personalidades -->
    <circle cx="0" cy="-100" r="30" fill="#9370DB" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="-95" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Filosófica</text>
    <text x="0" y="-82" text-anchor="middle" fill="#ddd" font-size="7">~infinitas</text>
    
    <circle cx="87" cy="50" r="30" fill="#FFA500" opacity="0.8" filter="url(#glow)"/>
    <text x="87" y="55" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Práctica</text>
    <text x="87" y="68" text-anchor="middle" fill="#ddd" font-size="7">~infinitas</text>
    
    <circle cx="-87" cy="50" r="30" fill="#32CD32" opacity="0.8" filter="url(#glow)"/>
    <text x="-87" y="55" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Creativa</text>
    <text x="-87" y="68" text-anchor="middle" fill="#ddd" font-size="7">~infinitas</text>
    
    <circle cx="0" cy="100" r="25" fill="#FF6347" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="105" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Concisa</text>
    
    <circle cx="-100" cy="-30" r="22" fill="#00CED1" opacity="0.8" filter="url(#glow)"/>
    <text x="-100" y="-25" text-anchor="middle" fill="white" font-size="8" font-weight="bold">Estoica</text>
    
    <circle cx="100" cy="-30" r="22" fill="#FF69B4" opacity="0.8" filter="url(#glow)"/>
    <text x="100" y="-25" text-anchor="middle" fill="white" font-size="8" font-weight="bold">Espiritual</text>
    
    <!-- Puntos infinitos (variaciones) -->
    <g fill="white" opacity="0.3">
      <circle cx="10" cy="-120" r="3"/>
      <circle cx="-10" cy="-80" r="3"/>
      <circle cx="20" cy="-110" r="2"/>
      <circle cx="-20" cy="-90" r="2"/>
      <circle cx="100" cy="70" r="3"/>
      <circle cx="70" cy="70" r="2"/>
      <circle cx="-100" cy="70" r="3"/>
      <circle cx="-70" cy="70" r="2"/>
      <circle cx="120" cy="-20" r="2"/>
      <circle cx="80" cy="-40" r="2"/>
      <circle cx="-120" cy="-20" r="2"/>
      <circle cx="-80" cy="-40" r="2"/>
    </g>
    
    <!-- Centro -->
    <circle cx="0" cy="0" r="12" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#0a0a2e" font-size="8" font-weight="bold">∞</text>
    
    <!-- Nota -->
    <text x="0" y="190" text-anchor="middle" fill="#888" font-size="11">
      Cada familia tiene infinitas variaciones
    </text>
  </g>
  
  <!-- ==================== TABLA ==================== -->
  <g transform="translate(900, 400)">
    <text x="0" y="-180" text-anchor="middle" fill="#FF69B4" font-size="16" font-weight="bold">
      Familias que Descubrimos
    </text>
    
    <rect x="-200" y="-160" width="400" height="320" fill="#1a1a2e" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <!-- Header -->
    <rect x="-180" y="-140" width="360" height="25" fill="#FF69B4" rx="5"/>
    <text x="-100" y="-123" fill="#0a0a2e" font-size="10" font-weight="bold">Familia</text>
    <text x="80" y="-123" fill="#0a0a2e" font-size="10" font-weight="bold">Técnicas</text>
    <text x="160" y="-123" fill="#0a0a2e" font-size="10" font-weight="bold">Variaciones</text>
    
    <!-- Filas -->
    <text x="-100" y="-95" fill="#9370DB" font-size="10">Filosófica</text>
    <text x="80" y="-95" fill="#aaa" font-size="9">3</text>
    <text x="160" y="-95" fill="#FFD700" font-size="9">∞</text>
    
    <text x="-100" y="-70" fill="#FFA500" font-size="10">Práctica</text>
    <text x="80" y="-70" fill="#aaa" font-size="9">2</text>
    <text x="160" y="-70" fill="#FFD700" font-size="9">∞</text>
    
    <text x="-100" y="-45" fill="#32CD32" font-size="10">Creativa</text>
    <text x="80" y="-45" fill="#aaa" font-size="9">2</text>
    <text x="160" y="-45" fill="#FFD700" font-size="9">∞</text>
    
    <text x="-100" y="-20" fill="#FF6347" font-size="10">Concisa</text>
    <text x="80" y="-20" fill="#aaa" font-size="9">1</text>
    <text x="160" y="-20" fill="#FFD700" font-size="9">∞</text>
    
    <text x="-100" y="5" fill="#00CED1" font-size="10">Estoica</text>
    <text x="80" y="5" fill="#aaa" font-size="9">1</text>
    <text x="160" y="5" fill="#FFD700" font-size="9">∞</text>
    
    <text x="-100" y="30" fill="#FF69B4" font-size="10">Espiritual</text>
    <text x="80" y="30" fill="#aaa" font-size="9">1</text>
    <text x="160" y="30" fill="#FFD700" font-size="9">∞</text>
    
    <text x="-100" y="55" fill="#888" font-size="10">Auténtica</text>
    <text x="80" y="55" fill="#aaa" font-size="9">1</text>
    <text x="160" y="55" fill="#FFD700" font-size="9">∞</text>
    
    <line x1="-180" y1="75" x2="180" y2="75" stroke="#4a5568" stroke-width="1"/>
    
    <text x="-100" y="100" fill="white" font-size="11" font-weight="bold">Total familias:</text>
    <text x="80" y="100" fill="#FFD700" font-size="11" font-weight="bold">10</text>
    
    <text x="-100" y="125" fill="white" font-size="11" font-weight="bold">Total variaciones:</text>
    <text x="80" y="125" fill="#FF69B4" font-size="11" font-weight="bold">∞ × 10</text>
    
    <text x="0" y="155" text-anchor="middle" fill="#888" font-size="9" font-style="italic">
      Solo exploramos &lt;1% del espacio
    </text>
  </g>
  
  <!-- ==================== ECUACIÓN ==================== -->
  <g transform="translate(600, 720)">
    <rect x="-450" y="-30" width="900" height="70" fill="#0d1117" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="0" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Personalidades = Familias × Variaciones por familia
    </text>
    
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-size="12">
      ~10 familias × ∞ variaciones = <tspan fill="#FF69B4" font-weight="bold">∞ personalidades posibles</tspan>
    </text>
  </g>
</svg>
