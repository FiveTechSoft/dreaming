<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="divineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="1400" height="800" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="700" y="40" text-anchor="middle" fill="white" font-size="28" font-weight="bold">
    Cámara: "Jesus de Nazareth"
  </text>
  <text x="700" y="70" text-anchor="middle" fill="#FFD700" font-size="14">
    Lo que el modelo "ve" cuando piensa en este concepto
  </text>
  
  <!-- ==================== RESPUESTA DEL MODELO ==================== -->
  <g transform="translate(700, 160)">
    <rect x="-500" y="-40" width="1000" height="120" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-15" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Respuesta del Modelo
    </text>
    
    <text x="0" y="10" text-anchor="middle" fill="white" font-size="11">
      "The people who heard him spoke of his wisdom, which was great and awesome.
    </text>
    <text x="0" y="28" text-anchor="middle" fill="white" font-size="11">
      They marveled at his teaching, which was clear and distinct..."
    </text>
  </g>
  
  <!-- ==================== DIRECCIÓN EN EL MANIFOLD ==================== -->
  <g transform="translate(350, 420)">
    <text x="0" y="-180" text-anchor="middle" fill="#4ECDC4" font-size="16" font-weight="bold">
      Dirección en el Manifold
    </text>
    
    <!-- Manifold representado como círculo -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Punto central: "Jesus de Nazareth" -->
    <circle cx="0" cy="0" r="25" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">JESUS</text>
    
    <!-- Conceptos cercanos -->
    <!-- Sabiduría -->
    <circle cx="-80" cy="-60" r="15" fill="#4ECDC4" opacity="0.8"/>
    <text x="-80" y="-55" text-anchor="middle" fill="white" font-size="8">Wisdom</text>
    
    <!-- Enseñanza -->
    <circle cx="80" cy="-60" r="15" fill="#9370DB" opacity="0.8"/>
    <text x="80" y="-55" text-anchor="middle" fill="white" font-size="8">Teaching</text>
    
    <!-- Fe -->
    <circle cx="-100" cy="40" r="12" fill="#FF69B4" opacity="0.8"/>
    <text x="-100" y="45" text-anchor="middle" fill="white" font-size="8">Faith</text>
    
    <!-- Amor -->
    <circle cx="100" cy="40" r="12" fill="#FF6347" opacity="0.8"/>
    <text x="100" y="45" text-anchor="middle" fill="white" font-size="8">Love</text>
    
    <!-- Dios -->
    <circle cx="0" cy="-100" r="18" fill="#FFD700" opacity="0.6" filter="url(#glow)"/>
    <text x="0" y="-95" text-anchor="middle" fill="#0a0a2e" font-size="8" font-weight="bold">God</text>
    
    <!-- Hijo -->
    <circle cx="0" cy="100" r="14" fill="#32CD32" opacity="0.8"/>
    <text x="0" y="105" text-anchor="middle" fill="#0a0a2e" font-size="8">Son</text>
    
    <!-- Conexiones -->
    <line x1="0" y1="0" x2="-80" y2="-60" stroke="#4ECDC4" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="80" y2="-60" stroke="#9370DB" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="-100" y2="40" stroke="#FF69B4" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="100" y2="40" stroke="#FF6347" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#32CD32" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- ==================== CONCEPTOS ACTIVADOS ==================== -->
  <g transform="translate(1050, 420)">
    <text x="0" y="-180" text-anchor="middle" fill="#FF69B4" font-size="16" font-weight="bold">
      Conceptos Activados
    </text>
    
    <rect x="-150" y="-160" width="300" height="320" fill="#1a1a2e" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <!-- Categorías -->
    <text x="-130" y="-130" fill="#FFD700" font-size="12" font-weight="bold">Religioso</text>
    <text x="-130" y="-115" fill="#aaa" font-size="10">jesus, christ, god, faith, holy</text>
    
    <text x="-130" y="-80" fill="#4ECDC4" font-size="12" font-weight="bold">Moral</text>
    <text x="-130" y="-65" fill="#aaa" font-size="10">good, evil, virtue, righteous</text>
    
    <text x="-130" y="-30" fill="#9370DB" font-size="12" font-weight="bold">Histórico</text>
    <text x="-130" y="-15" fill="#aaa" font-size="10">born, lived, died, rome, judea</text>
    
    <text x="-130" y="20" fill="#FF69B4" font-size="12" font-weight="bold">Filosófico</text>
    <text x="-130" y="35" fill="#aaa" font-size="10">teach, wisdom, truth, love</text>
    
    <text x="-130" y="70" fill="#32CD32" font-size="12" font-weight="bold">Humano</text>
    <text x="-130" y="85" fill="#aaa" font-size="10">man, human, son, mother</text>
    
    <!-- Score -->
    <line x1="-130" y1="110" x2="130" y2="110" stroke="#FFD700" stroke-width="2"/>
    <text x="0" y="140" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Dirección: 6 dimensiones activas
    </text>
  </g>
  
  <!-- ==================== INTERPRETACIÓN ==================== -->
  <g transform="translate(700, 700)">
    <rect x="-450" y="-40" width="900" height="100" fill="#0d1117" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-10" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Interpretación
    </text>
    
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="12">
      "Jesus de Nazareth" apunta a una región del manifold donde confluyen:
    </text>
    
    <text x="0" y="40" text-anchor="middle" fill="#4ECDC4" font-size="11">
      Sabiduría + Enseñanza + Fe + Amor + Divinidad + Humanidad
    </text>
  </g>
</svg>
