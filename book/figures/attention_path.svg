<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFD700"/>
    </marker>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="600" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="500" y="35" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial">
    Camino de Atención: "gato" → "alfombra"
  </text>
  
  <!-- ==================== TOKENS ==================== -->
  <g transform="translate(500, 100)">
    <!-- Tokens -->
    <g font-family="Arial" font-size="14">
      <!-- El -->
      <rect x="-350" y="-20" width="70" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
      <text x="-315" y="5" text-anchor="middle" fill="#888">El</text>
      
      <!-- gato (destacado) -->
      <rect x="-250" y="-25" width="90" height="50" fill="#FF69B4" stroke="#FF69B4" stroke-width="2" rx="8" filter="url(#glow)"/>
      <text x="-205" y="8" text-anchor="middle" fill="white" font-weight="bold">gato</text>
      
      <!-- duerme -->
      <rect x="-130" y="-20" width="90" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
      <text x="-85" y="5" text-anchor="middle" fill="#888">duerme</text>
      
      <!-- sobre -->
      <rect x="-20" y="-20" width="80" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
      <text x="20" y="5" text-anchor="middle" fill="#888">sobre</text>
      
      <!-- la -->
      <rect x="80" y="-20" width="50" height="40" fill="#2d3748" stroke="#4a5568" stroke-width="1" rx="8"/>
      <text x="105" y="5" text-anchor="middle" fill="#888">la</text>
      
      <!-- alfombra (destacado) -->
      <rect x="150" y="-25" width="110" height="50" fill="#FF69B4" stroke="#FF69B4" stroke-width="2" rx="8" filter="url(#glow)"/>
      <text x="205" y="8" text-anchor="middle" fill="white" font-weight="bold">alfombra</text>
    </g>
    
    <!-- Paso 1: gato → duerme -->
    <g>
      <path d="M -160 25 Q -125 80 -85 25" fill="none" stroke="#32CD32" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="-160" y="70" width="80" height="25" fill="#32CD32" rx="5"/>
      <text x="-120" y="87" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Paso 1</text>
    </g>
    
    <!-- Paso 2: duerme → sobre -->
    <g>
      <path d="M -40 25 Q 0 80 20 25" fill="none" stroke="#9370DB" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="-30" y="70" width="80" height="25" fill="#9370DB" rx="5"/>
      <text x="10" y="87" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Paso 2</text>
    </g>
    
    <!-- Paso 3: sobre → la -->
    <g>
      <path d="M 60 25 Q 80 80 105 25" fill="none" stroke="#00CED1" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="65" y="70" width="80" height="25" fill="#00CED1" rx="5"/>
      <text x="105" y="87" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Paso 3</text>
    </g>
    
    <!-- Paso 4: la → alfombra -->
    <g>
      <path d="M 130 25 Q 165 80 205 25" fill="none" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="140" y="70" width="80" height="25" fill="#FFD700" rx="5"/>
      <text x="180" y="87" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">Paso 4</text>
    </g>
  </g>
  
  <!-- ==================== EXPLICACIÓN DE CADA PASO ==================== -->
  <g transform="translate(500, 280)">
    <text x="0" y="-20" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">
      ¿Qué hace cada paso?
    </text>
    
    <!-- Paso 1 -->
    <g transform="translate(-400, 10)">
      <rect x="0" y="0" width="180" height="100" fill="#2d3748" stroke="#32CD32" stroke-width="2" rx="10"/>
      <text x="90" y="25" text-anchor="middle" fill="#32CD32" font-size="12" font-weight="bold">Paso 1: gato → duerme</text>
      <text x="90" y="50" text-anchor="middle" fill="#aaa" font-size="10">Query: "¿Qué hago?"</text>
      <text x="90" y="68" text-anchor="middle" fill="#aaa" font-size="10">Key: "soy un verbo"</text>
      <text x="90" y="86" text-anchor="middle" fill="#32CD32" font-size="10" font-weight="bold">Peso: 0.85 ✓</text>
    </g>
    
    <!-- Paso 2 -->
    <g transform="translate(-180, 10)">
      <rect x="0" y="0" width="180" height="100" fill="#2d3748" stroke="#9370DB" stroke-width="2" rx="10"/>
      <text x="90" y="25" text-anchor="middle" fill="#9370DB" font-size="12" font-weight="bold">Paso 2: duerme → sobre</text>
      <text x="90" y="50" text-anchor="middle" fill="#aaa" font-size="10">Query: "¿dónde?"</text>
      <text x="90" y="68" text-anchor="middle" fill="#aaa" font-size="10">Key: "soy una prep"</text>
      <text x="90" y="86" text-anchor="middle" fill="#9370DB" font-size="10" font-weight="bold">Peso: 0.72 ✓</text>
    </g>
    
    <!-- Paso 3 -->
    <g transform="translate(40, 10)">
      <rect x="0" y="0" width="180" height="100" fill="#2d3748" stroke="#00CED1" stroke-width="2" rx="10"/>
      <text x="90" y="25" text-anchor="middle" fill="#00CED1" font-size="12" font-weight="bold">Paso 3: sobre → la</text>
      <text x="90" y="50" text-anchor="middle" fill="#aaa" font-size="10">Query: "¿qué sigue?"</text>
      <text x="90" y="68" text-anchor="middle" fill="#aaa" font-size="10">Key: "soy un artículo"</text>
      <text x="90" y="86" text-anchor="middle" fill="#00CED1" font-size="10" font-weight="bold">Peso: 0.65 ✓</text>
    </g>
    
    <!-- Paso 4 -->
    <g transform="translate(260, 10)">
      <rect x="0" y="0" width="180" height="100" fill="#2d3748" stroke="#FFD700" stroke-width="2" rx="10"/>
      <text x="90" y="25" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="bold">Paso 4: la → alfombra</text>
      <text x="90" y="50" text-anchor="middle" fill="#aaa" font-size="10">Query: "¿qué?"</text>
      <text x="90" y="68" text-anchor="middle" fill="#aaa" font-size="10">Key: "soy un sustantivo"</text>
      <text x="90" y="86" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold">Peso: 0.90 ✓</text>
    </g>
  </g>
  
  <!-- ==================== CAMINO COMPLETO ==================== -->
  <g transform="translate(500, 480)">
    <rect x="-450" y="-30" width="900" height="100" fill="#1a1a2e" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <text x="0" y="0" text-anchor="middle" fill="#FF69B4" font-size="14" font-weight="bold">
      Camino completo: gato → duerme → sobre → la → alfombra
    </text>
    
    <text x="0" y="30" text-anchor="middle" fill="#aaa" font-size="11">
      Pesos: 0.85 × 0.72 × 0.65 × 0.90 = <tspan fill="#FFD700" font-weight="bold">0.36</tspan> (conexión total)
    </text>
    
    <text x="0" y="55" text-anchor="middle" fill="#888" font-size="10">
      La atención no salta directamente — sigue una CADENA de relaciones gramaticales
    </text>
  </g>
  
  <!-- ==================== NOTA FINAL ==================== -->
  <g transform="translate(500, 560)">
    <text x="0" y="0" text-anchor="middle" fill="#4a5568" font-size="11" font-style="italic">
      "El modelo no 've' gato y alfombra juntos — los CONECTA a través de la estructura de la oración"
    </text>
  </g>
</svg>
