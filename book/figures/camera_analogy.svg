<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="500" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="500" y="35" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial, sans-serif">
    Analogía del Videojuego: Cámaras en el Espacio de Pesos
  </text>
  
  <!-- ==================== MUNTO 3D (centro) ==================== -->
  <g transform="translate(500, 280)">
    <!-- Suelo del mundo -->
    <ellipse cx="0" cy="100" rx="200" ry="60" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
    
    <!-- "Colinas" del mundo (representan regiones de coherencia) -->
    <ellipse cx="-80" cy="80" rx="50" ry="25" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <ellipse cx="60" cy="70" rx="60" ry="30" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <ellipse cx="-30" cy="60" rx="40" ry="20" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    
    <!-- Puntos de coherencia (las "montañas") -->
    <circle cx="-80" cy="70" r="25" fill="#FFD700" opacity="0.8" filter="url(#glow)"/>
    <circle cx="60" cy="55" r="30" fill="#9370DB" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-30" cy="50" r="20" fill="#00CED1" opacity="0.8" filter="url(#glow)"/>
    <circle cx="120" cy="65" r="22" fill="#FF6347" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-120" cy="75" r="18" fill="#32CD32" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Etiquetas de las regiones -->
    <text x="-80" y="75" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold" font-family="Arial">Baseline</text>
    <text x="60" y="60" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold" font-family="Arial">Filosófica</text>
    <text x="-30" y="55" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold" font-family="Arial">Estoica</text>
    <text x="120" y="70" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold" font-family="Arial">Concisa</text>
    <text x="-120" y="80" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold" font-family="Arial">Creativa</text>
    
    <!-- Etiqueta del mundo -->
    <text x="0" y="150" text-anchor="middle" fill="#888" font-size="12" font-style="italic" font-family="Arial">
      "Mundo" del LLM (Espacio de Pesos)
    </text>
  </g>
  
  <!-- ==================== CÁMARA 1: Filosófica (izquierda) ==================== -->
  <g transform="translate(80, 180)">
    <!-- Cuerpo de la cámara -->
    <rect x="0" y="10" width="60" height="40" rx="5" fill="#9370DB" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#1a1a2e" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" fill="#9370DB"/>
    
    <!-- Lente apuntando al mundo -->
    <polygon points="60,20 100,40 60,50" fill="#9370DB" opacity="0.6"/>
    
    <!-- Nombre -->
    <text x="30" y="70" text-anchor="middle" fill="#9370DB" font-size="11" font-weight="bold" font-family="Arial">Filosófica</text>
    <text x="30" y="85" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">Ve: "¿Por qué existimos?"</text>
    
    <!-- Línea de visión -->
    <line x1="100" y1="35" x2="420" y2="250" stroke="#9370DB" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  </g>
  
  <!-- ==================== CÁMARA 2: Práctica (derecha) ==================== -->
  <g transform="translate(860, 180)">
    <!-- Cuerpo de la cámara -->
    <rect x="0" y="10" width="60" height="40" rx="5" fill="#FFA500" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#1a1a2e" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" fill="#FFA500"/>
    
    <!-- Lente apuntando al mundo -->
    <polygon points="0,20 -40,40 0,50" fill="#FFA500" opacity="0.6"/>
    
    <!-- Nombre -->
    <text x="30" y="70" text-anchor="middle" fill="#FFA500" font-size="11" font-weight="bold" font-family="Arial">Práctica</text>
    <text x="30" y="85" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">Ve: "¿Cómo se hace?"</text>
    
    <!-- Línea de visión -->
    <line x1="0" y1="35" x2="580" y2="250" stroke="#FFA500" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  </g>
  
  <!-- ==================== CÁMARA 3: Concisa (arriba) ==================== -->
  <g transform="translate(450, 80)">
    <!-- Cuerpo de la cámara -->
    <rect x="0" y="10" width="60" height="40" rx="5" fill="#FF6347" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#1a1a2e" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" fill="#FF6347"/>
    
    <!-- Lente apuntando al mundo -->
    <polygon points="20,50 30,100 40,50" fill="#FF6347" opacity="0.6"/>
    
    <!-- Nombre -->
    <text x="30" y="10" text-anchor="middle" fill="#FF6347" font-size="11" font-weight="bold" font-family="Arial">Concisa</text>
    
    <!-- Línea de visión -->
    <line x1="30" y1="100" x2="500" y2="230" stroke="#FF6347" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  </g>
  
  <!-- ==================== CÁMARA 4: Creativa (abajo) ==================== -->
  <g transform="translate(450, 380)">
    <!-- Cuerpo de la cámara -->
    <rect x="0" y="10" width="60" height="40" rx="5" fill="#32CD32" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="15" fill="#1a1a2e" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="8" fill="#32CD32"/>
    
    <!-- Lente apuntando al mundo -->
    <polygon points="20,10 30,-40 40,10" fill="#32CD32" opacity="0.6"/>
    
    <!-- Nombre -->
    <text x="30" y="70" text-anchor="middle" fill="#32CD32" font-size="11" font-weight="bold" font-family="Arial">Creativa</text>
    
    <!-- Línea de visión -->
    <line x1="30" y1="10" x2="500" y2="300" stroke="#32CD32" stroke-width="2" stroke-dasharray="8,4" opacity="0.5"/>
  </g>
  
  <!-- ==================== Explicación ==================== -->
  <g transform="translate(50, 420)">
    <rect x="0" y="0" width="900" height="70" fill="#1a1a2e" stroke="#333" stroke-width="1" rx="10"/>
    
    <text x="20" y="25" fill="white" font-size="13" font-weight="bold" font-family="Arial">La Analogía:</text>
    
    <text x="20" y="50" fill="#aaa" font-size="11" font-family="Arial">
      En un videojuego, puedes mover la cámara para ver el mismo mundo desde diferentes ángulos.
    </text>
    <text x="20" y="65" fill="#aaa" font-size="11" font-family="Arial">
      En un LLM, cada "perspectiva" es como una cámara diferente: mismo modelo, diferente punto de vista.
    </text>
    
    <text x="700" y="25" fill="#FFD700" font-size="11" font-weight="bold" font-family="Arial">Mundo = Pesos del LLM</text>
    <text x="700" y="45" fill="#9370DB" font-size="11" font-weight="bold" font-family="Arial">Cámaras = Perspectivas</text>
    <text x="700" y="65" fill="#00CED1" font-size="11" font-weight="bold" font-family="Arial">Vistas = Texto generado</text>
  </g>
</svg>
