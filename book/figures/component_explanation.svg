<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="800" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="500" y="35" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial">
    ¿Qué Hace Cada Componente?
  </text>
  
  <!-- ==================== TABLA ==================== -->
  <g transform="translate(500, 100)">
    
    <!-- Header -->
    <rect x="-450" y="0" width="900" height="30" fill="#FFD700" rx="5"/>
    <text x="-380" y="20" fill="#0a0a2e" font-size="11" font-weight="bold" font-family="Arial">Componente</text>
    <text x="-150" y="20" fill="#0a0a2e" font-size="11" font-weight="bold" font-family="Arial">Qué hace</text>
    <text x="200" y="20" fill="#0a0a2e" font-size="11" font-weight="bold" font-family="Arial">Analogía</text>
    <text x="400" y="20" fill="#0a0a2e" font-size="11" font-weight="bold" font-family="Arial">% y Pesos</text>
    
    <!-- Fila 1: Embedding -->
    <rect x="-450" y="40" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="65" fill="#FFD700" font-size="12" font-weight="bold" font-family="Arial">Embedding</text>
    <text x="-380" y="82" fill="#888" font-size="9" font-family="Arial">32000 × 2048</text>
    <text x="-150" y="65" fill="white" font-size="10" font-family="Arial">Convierte token en vector</text>
    <text x="-150" y="82" fill="#aaa" font-size="9" font-family="Arial">"gato" → [0.2, -0.8, ...]</text>
    <text x="200" y="73" fill="#aaa" font-size="10" font-family="Arial">Diccionario: palabra → número</text>
    <text x="420" y="73" fill="#FFD700" font-size="11" font-weight="bold" font-family="Arial">5.8% (65.5M)</text>
    
    <!-- Fila 2: Q -->
    <rect x="-450" y="105" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="130" fill="#FF6B6B" font-size="12" font-weight="bold" font-family="Arial">Attention Q</text>
    <text x="-380" y="147" fill="#888" font-size="9" font-family="Arial">Query: "¿Qué busco?"</text>
    <text x="-150" y="130" fill="white" font-size="10" font-family="Arial">Token pregunta qué necesita</text>
    <text x="-150" y="147" fill="#aaa" font-size="9" font-family="Arial">"gato" busca: ¿quién duerme?</text>
    <text x="200" y="138" fill="#aaa" font-size="10" font-family="Arial">Tu búsqueda en Google</text>
    <text x="420" y="138" fill="#FF6B6B" font-size="11" font-weight="bold" font-family="Arial">8.2% (92.3M)</text>
    
    <!-- Fila 3: K -->
    <rect x="-450" y="170" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="195" fill="#32CD32" font-size="12" font-weight="bold" font-family="Arial">Attention K</text>
    <text x="-380" y="212" fill="#888" font-size="9" font-family="Arial">Key: "¿Qué ofrezco?"</text>
    <text x="-150" y="195" fill="white" font-size="10" font-family="Arial">Token anuncia qué tiene</text>
    <text x="-150" y="212" fill="#aaa" font-size="9" font-family="Arial">"duerme" ofrece: verbo</text>
    <text x="200" y="203" fill="#aaa" font-size="10" font-family="Arial">Resultados de Google</text>
    <text x="420" y="203" fill="#32CD32" font-size="11" font-weight="bold" font-family="Arial">8.2% (92.3M)</text>
    
    <!-- Fila 4: V -->
    <rect x="-450" y="235" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="260" fill="#4ECDC4" font-size="12" font-weight="bold" font-family="Arial">Attention V</text>
    <text x="-380" y="277" fill="#888" font-size="9" font-family="Arial">Value: "¿Qué entrego?"</text>
    <text x="-150" y="260" fill="white" font-size="10" font-family="Arial">Token entrega su contenido</text>
    <text x="-150" y="277" fill="#aaa" font-size="9" font-family="Arial">"duerme" entrega: significado</text>
    <text x="200" y="268" fill="#aaa" font-size="10" font-family="Arial">Contenido de la web</text>
    <text x="420" y="268" fill="#4ECDC4" font-size="11" font-weight="bold" font-family="Arial">8.2% (92.3M)</text>
    
    <!-- Fila 5: Output Proj -->
    <rect x="-450" y="300" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="325" fill="#DDA0DD" font-size="12" font-weight="bold" font-family="Arial">Output Projection</text>
    <text x="-380" y="342" fill="#888" font-size="9" font-family="Arial">Combina cabezas de atención</text>
    <text x="-150" y="325" fill="white" font-size="10" font-family="Arial">Resume todas las respuestas</text>
    <text x="-150" y="342" fill="#aaa" font-size="9" font-family="Arial">16 cabezas → 1 resultado</text>
    <text x="200" y="333" fill="#aaa" font-size="10" font-family="Arial">Resumir resultados</text>
    <text x="420" y="333" fill="#DDA0DD" font-size="11" font-weight="bold" font-family="Arial">8.2% (92.3M)</text>
    
    <!-- Fila 6: FFN Gate -->
    <rect x="-450" y="365" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="390" fill="#FFA500" font-size="12" font-weight="bold" font-family="Arial">FFN Gate</text>
    <text x="-380" y="407" fill="#888" font-size="9" font-family="Arial">"¿Qué activar?"</text>
    <text x="-150" y="390" fill="white" font-size="10" font-family="Arial">Decide qué conocimiento usar</text>
    <text x="-150" y="407" fill="#aaa" font-size="9" font-family="Arial">Interruptor on/off</text>
    <text x="200" y="398" fill="#aaa" font-size="10" font-family="Arial">Interruptor on/off</text>
    <text x="420" y="398" fill="#FFA500" font-size="11" font-weight="bold" font-family="Arial">22.4% (253.8M)</text>
    
    <!-- Fila 7: FFN Up -->
    <rect x="-450" y="430" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="455" fill="#FF6347" font-size="12" font-weight="bold" font-family="Arial">FFN Up</text>
    <text x="-380" y="472" fill="#888" font-size="9" font-family="Arial">"¿Qué construir?"</text>
    <text x="-150" y="455" fill="white" font-size="10" font-family="Arial">Amplía para procesar</text>
    <text x="-150" y="472" fill="#aaa" font-size="9" font-family="Arial">2048 → 5632 dimensiones</text>
    <text x="200" y="463" fill="#aaa" font-size="10" font-family="Arial">Ampliar para trabajar</text>
    <text x="420" y="463" fill="#FF6347" font-size="11" font-weight="bold" font-family="Arial">22.4% (253.8M)</text>
    
    <!-- Fila 8: FFN Down -->
    <rect x="-450" y="495" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="520" fill="#96CEB4" font-size="12" font-weight="bold" font-family="Arial">FFN Down</text>
    <text x="-380" y="537" fill="#888" font-size="9" font-family="Arial">"¿Cómo comprimir?"</text>
    <text x="-150" y="520" fill="white" font-size="10" font-family="Arial">Vuelve al tamaño original</text>
    <text x="-150" y="537" fill="#aaa" font-size="9" font-family="Arial">5632 → 2048 dimensiones</text>
    <text x="200" y="528" fill="#aaa" font-size="10" font-family="Arial">Comprimir resultado</text>
    <text x="420" y="528" fill="#96CEB4" font-size="11" font-weight="bold" font-family="Arial">22.4% (253.8M)</text>
    
    <!-- Fila 9: Layer Norms -->
    <rect x="-450" y="560" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="585" fill="#888" font-size="12" font-weight="bold" font-family="Arial">Layer Norms</text>
    <text x="-380" y="602" fill="#888" font-size="9" font-family="Arial">Normaliza valores</text>
    <text x="-150" y="585" fill="white" font-size="10" font-family="Arial">Estabilidad numérica</text>
    <text x="-150" y="602" fill="#aaa" font-size="9" font-family="Arial">Pone todos en misma escala</text>
    <text x="200" y="593" fill="#aaa" font-size="10" font-family="Arial">Misma escala</text>
    <text x="420" y="593" fill="#888" font-size="11" font-weight="bold" font-family="Arial">0.01% (90K)</text>
    
    <!-- Fila 10: LM Head -->
    <rect x="-450" y="625" width="900" height="55" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-380" y="650" fill="#FF69B4" font-size="12" font-weight="bold" font-family="Arial">LM Head</text>
    <text x="-380" y="667" fill="#888" font-size="9" font-family="Arial">2048 × 32000</text>
    <text x="-150" y="650" fill="white" font-size="10" font-family="Arial">Predice siguiente token</text>
    <text x="-150" y="667" fill="#aaa" font-size="9" font-family="Arial">[vector] → probabilidades</text>
    <text x="200" y="658" fill="#aaa" font-size="10" font-family="Arial">Predecir siguiente palabra</text>
    <text x="420" y="658" fill="#FF69B4" font-size="11" font-weight="bold" font-family="Arial">5.8% (65.5M)</text>
  </g>
  
  <!-- ==================== FLUJO ==================== -->
  <g transform="translate(500, 740)">
    <rect x="-400" y="-15" width="800" height="50" fill="#0d1117" stroke="#FFD700" stroke-width="2" rx="10"/>
    <text x="0" y="10" text-anchor="middle" fill="#FFD700" font-size="11" font-weight="bold" font-family="Arial">
      Flujo: Embedding → Attention(Q+K+V) → FFN(Gate+Up+Down) → LM Head → Siguiente token
    </text>
    <text x="0" y="28" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
      FFN (67%) almacena conocimiento | Attention (33%) conecta tokens
    </text>
  </g>
</svg>
