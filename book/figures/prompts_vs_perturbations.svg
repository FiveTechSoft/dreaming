<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="900" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="600" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">
    Preguntas Clave: Prompts vs Perturbaciones
  </text>
  
  <!-- ==================== PREGUNTA 1 ==================== -->
  <g transform="translate(350, 150)">
    <text x="0" y="-60" text-anchor="middle" fill="#FF69B4" font-size="16" font-weight="bold">
      P1: ¿Cuántas palabras se relacionan con "gato"?
    </text>
    
    <rect x="-280" y="-40" width="560" height="180" fill="#1a1a2e" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <!-- Respuesta -->
    <text x="0" y="-10" text-anchor="middle" fill="#32CD32" font-size="14" font-weight="bold">
      SÍ se puede calcular
    </text>
    
    <text x="0" y="20" text-anchor="middle" fill="#aaa" font-size="11">
      Pero necesitas los PESOS Q, K del modelo
    </text>
    
    <!-- Ejemplo -->
    <g transform="translate(-220, 45)">
      <text x="0" y="0" fill="#FFD700" font-size="11" font-weight="bold">Fórmula:</text>
      <text x="0" y="20" fill="#aaa" font-size="10" font-family="monospace">atencion = softmax(Q_gato · K_TODOS / √d)</text>
    </g>
    
    <!-- Resultado simulado -->
    <g transform="translate(-220, 100)">
      <text x="0" y="0" fill="#888" font-size="10">Resultado para "gato":</text>
      <text x="0" y="18" fill="#4ECDC4" font-size="10">→ "duerme" (0.85)</text>
      <text x="0" y="33" fill="#4ECDC4" font-size="10">→ "peludo" (0.72)</text>
      <text x="0" y="48" fill="#4ECDC4" font-size="10">→ "animal" (0.68)</text>
      <text x="0" y="63" fill="#4ECDC4" font-size="10">→ "alfombra" (0.45)</text>
    </g>
    
    <text x="0" y="155" text-anchor="middle" fill="#FFD700" font-size="10" font-style="italic">
      "Cada palabra tiene miles de conexiones potenciales"
    </text>
  </g>
  
  <!-- ==================== PREGUNTA 2 ==================== -->
  <g transform="translate(900, 150)">
    <text x="0" y="-60" text-anchor="middle" fill="#9370DB" font-size="16" font-weight="bold">
      P2: ¿Necesito un prompt?
    </text>
    
    <rect x="-250" y="-40" width="500" height="180" fill="#1a1a2e" stroke="#9370DB" stroke-width="2" rx="15"/>
    
    <text x="0" y="-10" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      SÍ, el prompt DIRIGE la búsqueda
    </text>
    
    <!-- Dos escenarios -->
    <g transform="translate(-200, 30)">
      <rect x="0" y="0" width="180" height="70" fill="#2d3748" rx="8"/>
      <text x="90" y="20" text-anchor="middle" fill="#FF6347" font-size="10" font-weight="bold">Sin prompt específico</text>
      <text x="90" y="40" text-anchor="middle" fill="#aaa" font-size="9">"gato" → conexiones vagas</text>
      <text x="90" y="55" text-anchor="middle" fill="#888" font-size="8"> Miles de conexiones débiles</text>
    </g>
    
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="180" height="70" fill="#2d3748" rx="8"/>
      <text x="90" y="20" text-anchor="middle" fill="#32CD32" font-size="10" font-weight="bold">Con prompt dirigido</text>
      <text x="90" y="40" text-anchor="middle" fill="#aaa" font-size="9">"El gato duerme"</text>
      <text x="90" y="55" text-anchor="middle" fill="#888" font-size="8"> Conexiones fuertes y claras</text>
    </g>
    
    <text x="0" y="155" text-anchor="middle" fill="#888" font-size="10">
      El prompt ACTIVA las conexiones relevantes
    </text>
  </g>
  
  <!-- ==================== PREGUNTA 3 (LA MÁS IMPORTANTE) ==================== -->
  <g transform="translate(600, 450)">
    <text x="0" y="-80" text-anchor="middle" fill="#FFD700" font-size="18" font-weight="bold">
      P3: ¿Se pueden lograr las perspectivas con prompts?
    </text>
    
    <rect x="-500" y="-60" width="1000" height="280" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <!-- Respuesta corta -->
    <text x="0" y="-25" text-anchor="middle" fill="#FF6347" font-size="14" font-weight="bold">
      NO exactamente. Son COMPLEMENTARIOS, no equivalentes.
    </text>
    
    <!-- Explicación -->
    <g transform="translate(-450, 10)">
      <text x="0" y="0" fill="#4ECDC4" font-size="13" font-weight="bold">PROMPT (Input)</text>
      <text x="0" y="22" fill="#aaa" font-size="10">• Selecciona QUÉ activar</text>
      <text x="0" y="40" fill="#aaa" font-size="10">• Mueve la cámara</text>
      <text x="0" y="58" fill="#aaa" font-size="10">• Cambia el punto de vista</text>
      <text x="0" y="85" fill="#FF6347" font-size="10" font-weight="bold">NO cambia cómo procesa</text>
    </g>
    
    <g transform="translate(-100, 10)">
      <text x="0" y="0" fill="#FFD700" font-size="24">≠</text>
    </g>
    
    <g transform="translate(50, 10)">
      <text x="0" y="0" fill="#9370DB" font-size="13" font-weight="bold">PERTURBACIÓN (Pesos)</text>
      <text x="0" y="22" fill="#aaa" font-size="10">• Cambia CÓMO procesar</text>
      <text x="0" y="40" fill="#aaa" font-size="10">• Cambia el lente</text>
      <text x="0" y="58" fill="#aaa" font-size="10">• Modifica las reglas</text>
      <text x="0" y="85" fill="#32CD32" font-size="10" font-weight="bold">CAMBIA los pesos Q, K, V</text>
    </g>
    
    <!-- Ejemplo -->
    <g transform="translate(-420, 120)">
      <rect x="0" y="0" width="840" height="80" fill="#0d1117" rx="10"/>
      
      <text x="420" y="20" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Ejemplo: "The meaning of life is"</text>
      
      <text x="50" y="45" fill="#FFD700" font-size="10">Baseline:</text>
      <text x="130" y="45" fill="#aaa" font-size="10">"...to find purpose..."</text>
      
      <text x="50" y="65" fill="#9370DB" font-size="10">+ Prompt filosófico:</text>
      <text x="180" y="65" fill="#aaa" font-size="10">"...to find purpose..." (¡igual!)</text>
      
      <text x="450" y="45" fill="#FF69B4" font-size="10">+ Perturbación filosófica:</text>
      <text x="610" y="45" fill="#aaa" font-size="10">"...existential inquiry..."</text>
      
      <text x="450" y="65" fill="#FF69B4" font-size="10">+ AMBOS:</text>
      <text x="540" y="65" fill="#32CD32" font-size="10">"...profound exploration..."</text>
    </g>
  </g>
  
  <!-- ==================== RESUMEN ==================== -->
  <g transform="translate(600, 780)">
    <rect x="-500" y="-30" width="1000" height="100" fill="#0d1117" stroke="#4ECDC4" stroke-width="2" rx="15"/>
    
    <text x="0" y="0" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold">
      Resumen
    </text>
    
    <text x="-400" y="30" fill="#aaa" font-size="10">✓ SÍ se puede calcular conexiones de una palabra</text>
    <text x="-400" y="48" fill="#aaa" font-size="10">✓ SÍ el prompt dirige la búsqueda</text>
    <text x="-400" y="66" fill="#aaa" font-size="10">✗ NO se replican perspetivas solo con prompts</text>
    
    <text x="100" y="30" fill="#FFD700" font-size="10" font-weight="bold">Prompt = DÓNDE miras</text>
    <text x="100" y="48" fill="#FFD700" font-size="10" font-weight="bold">Perturbación = CÓMO ves</text>
    <text x="100" y="66" fill="#FFD700" font-size="10" font-weight="bold">Combinación = Máximo control</text>
  </g>
</svg>
