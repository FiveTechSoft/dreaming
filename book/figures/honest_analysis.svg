<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="600" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">
    Análisis Honesto: ¿Qué Sabemos y Qué No?
  </text>
  
  <!-- ==================== SECCIÓN 1: DIMENSIONES ==================== -->
  <g transform="translate(300, 150)">
    <text x="0" y="-80" text-anchor="middle" fill="#FF6347" font-size="16" font-weight="bold" font-family="Arial">
      1. ¿Por qué ~1000 dimensiones?
    </text>
    
    <!-- Rectángulo de incertidumbre -->
    <rect x="-150" y="-60" width="300" height="100" fill="#1a1a2e" stroke="#FF6347" stroke-width="2" rx="10"/>
    
    <!-- Rango de incertidumbre -->
    <rect x="-120" y="-20" width="240" height="20" fill="#2d3748" rx="5"/>
    <rect x="-120" y="-20" width="60" height="20" fill="#FF6347" opacity="0.3" rx="5"/>
    <rect x="-60" y="-20" width="60" height="20" fill="#FF6347" opacity="0.5" rx="5"/>
    <rect x="0" y="-20" width="60" height="20" fill="#FF6347" opacity="0.7" rx="5"/>
    <rect x="60" y="-20" width="60" height="20" fill="#FF6347" opacity="0.9" rx="5"/>
    
    <!-- Etiquetas -->
    <text x="-120" y="20" fill="#888" font-size="9">100D</text>
    <text x="0" y="20" fill="#FF6347" font-size="10" font-weight="bold">1000D (estimación)</text>
    <text x="120" y="20" fill="#888" font-size="9">10000D</text>
    
    <!-- Texto explicativo -->
    <text x="0" y="50" text-anchor="middle" fill="#aaa" font-size="10" font-family="Arial">
      Es una ESTIMACIÓN, no un hecho
    </text>
    <text x="0" y="65" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
      Basada en PCA limitado (10 prompts, 11 modelos)
    </text>
  </g>
  
  <!-- ==================== SECCIÓN 2: FAMILIAS ==================== -->
  <g transform="translate(900, 150)">
    <text x="0" y="-80" text-anchor="middle" fill="#32CD32" font-size="16" font-weight="bold" font-family="Arial">
      2. ¿Por qué 6-10 familias?
    </text>
    
    <!-- Islas exploradas -->
    <rect x="-150" y="-60" width="300" height="100" fill="#1a1a2e" stroke="#32CD32" stroke-width="2" rx="10"/>
    
    <!-- Océano de incógnito -->
    <rect x="-140" y="-50" width="280" height="80" fill="#0d1117" rx="5"/>
    
    <!-- Islas exploradas (8) -->
    <circle cx="-80" cy="0" r="12" fill="#32CD32" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-40" cy="-20" r="10" fill="#9370DB" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="10" r="11" fill="#FFA500" opacity="0.8" filter="url(#glow)"/>
    <circle cx="40" cy="-15" r="9" fill="#00CED1" opacity="0.8" filter="url(#glow)"/>
    <circle cx="80" cy="5" r="10" fill="#FF6347" opacity="0.8" filter="url(#glow)"/>
    <circle cx="-60" cy="25" r="8" fill="#FF69B4" opacity="0.8" filter="url(#glow)"/>
    <circle cx="20" cy="-30" r="9" fill="#FFEAA7" opacity="0.8" filter="url(#glow)"/>
    <circle cx="60" cy="25" r="8" fill="#4ECDC4" opacity="0.8" filter="url(#glow)"/>
    
    <!-- Islas NO exploradas (muchas más) -->
    <g fill="#4a5568" opacity="0.4">
      <circle cx="-100" cy="-30" r="5"/>
      <circle cx="-100" cy="20" r="4"/>
      <circle cx="-120" cy="0" r="6"/>
      <circle cx="100" cy="-25" r="5"/>
      <circle cx="110" cy="15" r="4"/>
      <circle cx="120" cy="-5" r="6"/>
      <circle cx="-30" cy="40" r="4"/>
      <circle cx="30" cy="-40" r="4"/>
      <circle cx="-90" cy="-40" r="3"/>
      <circle cx="90" cy="35" r="3"/>
      <circle cx="-110" cy="35" r="3"/>
      <circle cx="100" cy="-40" r="3"/>
    </g>
    
    <!-- Texto -->
    <text x="0" y="50" text-anchor="middle" fill="#aaa" font-size="10" font-family="Arial">
      Solo exploramos 8 islas
    </text>
    <text x="0" y="65" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
      Puede haber 50-100+ islas por descubrir
    </text>
  </g>
  
  <!-- ==================== SECCIÓN 3: DIRECCIONES ==================== -->
  <g transform="translate(300, 400)">
    <text x="0" y="-80" text-anchor="middle" fill="#9370DB" font-size="16" font-weight="bold" font-family="Arial">
      3. ¿Los pesos tienen "direcciones"?
    </text>
    
    <!-- Espacio 2D simplificado -->
    <rect x="-180" y="-60" width="360" height="180" fill="#1a1a2e" stroke="#9370DB" stroke-width="2" rx="10"/>
    
    <!-- Manifold (superficie curva) -->
    <path d="M -150 50 Q -100 -30 -50 20 Q 0 70 50 10 Q 100 -50 150 30" 
          fill="none" stroke="#4a5568" stroke-width="3"/>
    
    <!-- Punto baseline -->
    <circle cx="0" cy="20" r="12" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="25" text-anchor="middle" fill="#0a0a2e" font-size="7" font-weight="bold">B</text>
    
    <!-- Direcciones BUENAS (tangentes) -->
    <line x1="0" y1="20" x2="80" y2="-15" stroke="#32CD32" stroke-width="3"/>
    <polygon points="80,-15 70,-10 75,-20" fill="#32CD32"/>
    <text x="100" y="-10" fill="#32CD32" font-size="9" font-weight="bold">Dirección BUENA</text>
    <text x="100" y="5" fill="#888" font-size="8">(tangente = coherente)</text>
    
    <line x1="0" y1="20" x2="-80" y2="55" stroke="#32CD32" stroke-width="3"/>
    <polygon points="-80,55 -70,50 -75,60" fill="#32CD32"/>
    <text x="-100" y="70" fill="#32CD32" font-size="9" font-weight="bold">Dirección BUENA</text>
    
    <!-- Direcciones MALAS (perpendiculares) -->
    <line x1="0" y1="20" x2="0" y2="-50" stroke="#FF6347" stroke-width="3"/>
    <polygon points="0,-50 -5,-40 5,-40" fill="#FF6347"/>
    <text x="30" y="-55" fill="#FF6347" font-size="9" font-weight="bold">Dirección MALA</text>
    <text x="30" y="-42" fill="#888" font-size="8">(perpendicular = basura)</text>
    
    <line x1="0" y1="20" x2="0" y2="90" stroke="#FF6347" stroke-width="3"/>
    <polygon points="0,90 -5,80 5,80" fill="#FF6347"/>
    
    <!-- Texto explicativo -->
    <text x="0" y="140" text-anchor="middle" fill="#aaa" font-size="10" font-family="Arial">
      SÍ hay direcciones, pero solo ALGUNAS son "buenas"
    </text>
  </g>
  
  <!-- ==================== SECCIÓN 4: LO QUE NO SABEMOS ==================== -->
  <g transform="translate(900, 400)">
    <text x="0" y="-80" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold" font-family="Arial">
      4. Lo que NO Sabemos
    </text>
    
    <rect x="-180" y="-60" width="360" height="180" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="10"/>
    
    <!-- Lista de incógnitas -->
    <text x="-160" y="-30" fill="#FF6347" font-size="11" font-weight="bold">?</text>
    <text x="-140" y="-30" fill="#aaa" font-size="10">Forma exacta de la manifold</text>
    
    <text x="-160" y="-5" fill="#FF6347" font-size="11" font-weight="bold">?</text>
    <text x="-140" y="-5" fill="#aaa" font-size="10">Si hay "agujeros" (incoherencia)</text>
    
    <text x="-160" y="20" fill="#FF6347" font-size="11" font-weight="bold">?</text>
    <text x="-140" y="20" fill="#aaa" font-size="10">Cuántas perspectivas faltan</text>
    
    <text x="-160" y="45" fill="#FF6347" font-size="11" font-weight="bold">?</text>
    <text x="-140" y="45" fill="#aaa" font-size="10">Si varía entre modelos</text>
    
    <text x="-160" y="70" fill="#FF6347" font-size="11" font-weight="bold">?</text>
    <text x="-140" y="70" fill="#aaa" font-size="10">Teoría que prediga direcciones</text>
    
    <text x="0" y="110" text-anchor="middle" fill="#888" font-size="9" font-style="italic">
      "Es como explorar la Tierra desde un barco"
    </text>
  </g>
  
  <!-- ==================== RESUMEN FINAL ==================== -->
  <g transform="translate(600, 650)">
    <rect x="-500" y="-40" width="1000" height="140" fill="#0d1117" stroke="#4a5568" stroke-width="1" rx="15"/>
    
    <text x="0" y="-10" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">
      Conclusión Honesta
    </text>
    
    <g transform="translate(-400, 20)">
      <text x="0" y="0" fill="#32CD32" font-size="12" font-weight="bold">LO QUE SABEMOS:</text>
      <text x="0" y="18" fill="#aaa" font-size="10">• La perturbación produce coherencia</text>
      <text x="0" y="33" fill="#aaa" font-size="10">• Algunas direcciones son mejores</text>
      <text x="0" y="48" fill="#aaa" font-size="10">• Hay múltiples tipos de perspectivas</text>
    </g>
    
    <g transform="translate(0, 20)">
      <text x="0" y="0" fill="#FFD700" font-size="12" font-weight="bold">LO QUE ESTIMAMOS:</text>
      <text x="0" y="18" fill="#aaa" font-size="10">• Dimensiones: 100-10000</text>
      <text x="0" y="33" fill="#aaa" font-size="10">• Familias: 50-100+</text>
      <text x="0" y="48" fill="#aaa" font-size="10">• Exploración: &lt;1% del espacio</text>
    </g>
    
    <g transform="translate(400, 20)">
      <text x="0" y="0" fill="#FF6347" font-size="12" font-weight="bold">LO QUE NO SABEMOS:</text>
      <text x="0" y="18" fill="#aaa" font-size="10">• Forma exacta de la manifold</text>
      <text x="0" y="33" fill="#aaa" font-size="10">• Cuántas perspectivas faltan</text>
      <text x="0" y="48" fill="#aaa" font-size="10">• Si es universal entre modelos</text>
    </g>
  </g>
</svg>
