<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="500" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">
    Anatomy of TinyLlama-1.1B
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#888" font-size="14" font-family="Arial">
    1,130,454,720 pesos en total
  </text>
  
  <!-- ==================== TABLA PRINCIPAL ==================== -->
  <g transform="translate(500, 130)">
    
    <!-- Header -->
    <rect x="-420" y="0" width="840" height="35" fill="#FFD700" rx="5"/>
    <text x="-350" y="23" fill="#0a0a2e" font-size="12" font-weight="bold" font-family="Arial">Componente</text>
    <text x="50" y="23" fill="#0a0a2e" font-size="12" font-weight="bold" font-family="Arial">Cálculo</text>
    <text x="220" y="23" fill="#0a0a2e" font-size="12" font-weight="bold" font-family="Arial">Pesos</text>
    <text x="350" y="23" fill="#0a0a2e" font-size="12" font-weight="bold" font-family="Arial">%</text>
    <text x="400" y="23" fill="#0a0a2e" font-size="12" font-weight="bold" font-family="Arial">Visual</text>
    
    <!-- Fila 1: Embedding -->
    <rect x="-420" y="45" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="75" fill="#FFD700" font-size="13" font-weight="bold" font-family="Arial">Embedding</text>
    <text x="50" y="75" fill="#aaa" font-size="10" font-family="monospace">32000 × 2048</text>
    <text x="220" y="75" fill="white" font-size="12" font-weight="bold" font-family="Arial">65,536,000</text>
    <text x="350" y="75" fill="#FFD700" font-size="12" font-weight="bold" font-family="Arial">5.8%</text>
    <!-- Barra -->
    <rect x="400" y="60" width="58" height="15" fill="#FFD700" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 2: Attention Q -->
    <rect x="-420" y="105" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="135" fill="#FF6B6B" font-size="13" font-weight="bold" font-family="Arial">Attention Q (×22 capas)</text>
    <text x="50" y="135" fill="#aaa" font-size="10" font-family="monospace">22 × 2048²</text>
    <text x="220" y="135" fill="white" font-size="12" font-weight="bold" font-family="Arial">92,274,688</text>
    <text x="350" y="135" fill="#FF6B6B" font-size="12" font-weight="bold" font-family="Arial">8.2%</text>
    <rect x="400" y="120" width="82" height="15" fill="#FF6B6B" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 3: Attention K -->
    <rect x="-420" y="165" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="195" fill="#32CD32" font-size="13" font-weight="bold" font-family="Arial">Attention K (×22 capas)</text>
    <text x="50" y="195" fill="#aaa" font-size="10" font-family="monospace">22 × 2048²</text>
    <text x="220" y="195" fill="white" font-size="12" font-weight="bold" font-family="Arial">92,274,688</text>
    <text x="350" y="195" fill="#32CD32" font-size="12" font-weight="bold" font-family="Arial">8.2%</text>
    <rect x="400" y="180" width="82" height="15" fill="#32CD32" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 4: Attention V -->
    <rect x="-420" y="225" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="255" fill="#4ECDC4" font-size="13" font-weight="bold" font-family="Arial">Attention V (×22 capas)</text>
    <text x="50" y="255" fill="#aaa" font-size="10" font-family="monospace">22 × 2048²</text>
    <text x="220" y="255" fill="white" font-size="12" font-weight="bold" font-family="Arial">92,274,688</text>
    <text x="350" y="255" fill="#4ECDC4" font-size="12" font-weight="bold" font-family="Arial">8.2%</text>
    <rect x="400" y="240" width="82" height="15" fill="#4ECDC4" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 5: Output Projection -->
    <rect x="-420" y="285" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="315" fill="#DDA0DD" font-size="13" font-weight="bold" font-family="Arial">Output Projection (×22)</text>
    <text x="50" y="315" fill="#aaa" font-size="10" font-family="monospace">22 × 2048²</text>
    <text x="220" y="315" fill="white" font-size="12" font-weight="bold" font-family="Arial">92,274,688</text>
    <text x="350" y="315" fill="#DDA0DD" font-size="12" font-weight="bold" font-family="Arial">8.2%</text>
    <rect x="400" y="300" width="82" height="15" fill="#DDA0DD" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 6: FFN Gate -->
    <rect x="-420" y="345" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="375" fill="#FFA500" font-size="13" font-weight="bold" font-family="Arial">FFN Gate (×22 capas)</text>
    <text x="50" y="375" fill="#aaa" font-size="10" font-family="monospace">22 × 2048 × 5632</text>
    <text x="220" y="375" fill="white" font-size="12" font-weight="bold" font-family="Arial">253,755,392</text>
    <text x="350" y="375" fill="#FFA500" font-size="12" font-weight="bold" font-family="Arial">22.4%</text>
    <rect x="400" y="360" width="224" height="15" fill="#FFA500" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 7: FFN Up -->
    <rect x="-420" y="405" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="435" fill="#FF6347" font-size="13" font-weight="bold" font-family="Arial">FFN Up (×22 capas)</text>
    <text x="50" y="435" fill="#aaa" font-size="10" font-family="monospace">22 × 2048 × 5632</text>
    <text x="220" y="435" fill="white" font-size="12" font-weight="bold" font-family="Arial">253,755,392</text>
    <text x="350" y="435" fill="#FF6347" font-size="12" font-weight="bold" font-family="Arial">22.4%</text>
    <rect x="400" y="420" width="224" height="15" fill="#FF6347" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 8: FFN Down -->
    <rect x="-420" y="465" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="495" fill="#96CEB4" font-size="13" font-weight="bold" font-family="Arial">FFN Down (×22 capas)</text>
    <text x="50" y="495" fill="#aaa" font-size="10" font-family="monospace">22 × 5632 × 2048</text>
    <text x="220" y="495" fill="white" font-size="12" font-weight="bold" font-family="Arial">253,755,392</text>
    <text x="350" y="495" fill="#96CEB4" font-size="12" font-weight="bold" font-family="Arial">22.4%</text>
    <rect x="400" y="480" width="224" height="15" fill="#96CEB4" rx="3" filter="url(#glow)"/>
    
    <!-- Fila 9: Norms -->
    <rect x="-420" y="525" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="555" fill="#888" font-size="13" font-weight="bold" font-family="Arial">Layer Norms</text>
    <text x="50" y="555" fill="#aaa" font-size="10" font-family="monospace">44 × 2048</text>
    <text x="220" y="555" fill="white" font-size="12" font-weight="bold" font-family="Arial">90,112</text>
    <text x="350" y="555" fill="#888" font-size="12" font-weight="bold" font-family="Arial">0.01%</text>
    <rect x="400" y="540" width="1" height="15" fill="#888" rx="3"/>
    
    <!-- Fila 10: LM Head -->
    <rect x="-420" y="585" width="840" height="50" fill="#1a1a2e" stroke="#2d3748" stroke-width="1" rx="3"/>
    <text x="-350" y="615" fill="#FF69B4" font-size="13" font-weight="bold" font-family="Arial">LM Head (output)</text>
    <text x="50" y="615" fill="#aaa" font-size="10" font-family="monospace">2048 × 32000</text>
    <text x="220" y="615" fill="white" font-size="12" font-weight="bold" font-family="Arial">65,536,000</text>
    <text x="350" y="615" fill="#FF69B4" font-size="12" font-weight="bold" font-family="Arial">5.8%</text>
    <rect x="400" y="600" width="58" height="15" fill="#FF69B4" rx="3" filter="url(#glow)"/>
    
    <!-- Total -->
    <rect x="-420" y="650" width="840" height="40" fill="#FFD700" rx="5"/>
    <text x="-350" y="677" fill="#0a0a2e" font-size="14" font-weight="bold" font-family="Arial">TOTAL</text>
    <text x="220" y="677" fill="#0a0a2e" font-size="14" font-weight="bold" font-family="Arial">1,130,454,720</text>
    <text x="350" y="677" fill="#0a0a2e" font-size="14" font-weight="bold" font-family="Arial">100%</text>
  </g>
  
  <!-- ==================== LEYENDA ==================== -->
  <g transform="translate(500, 820)">
    <rect x="-400" y="-15" width="800" height="50" fill="#0d1117" stroke="#4a5568" stroke-width="1" rx="10"/>
    <text x="0" y="10" text-anchor="middle" fill="#888" font-size="10" font-family="Arial">
      Attention = Q + K + V + Output = 32.8% | FFN = Gate + Up + Down = 67.2% | Embedding + LM Head = 11.6%
    </text>
  </g>
</svg>
