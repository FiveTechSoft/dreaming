<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  
  <!-- Título principal -->
  <text x="500" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">
    ¿Cuántas Perspectivas Existen?
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#888" font-size="14" font-family="Arial">
    Infinitas, pero agrupadas en familias
  </text>
  
  <!-- ==================== SECCIÓN 1: LA ESFERA ==================== -->
  <g transform="translate(250, 200)">
    <!-- Esfera (círculo grande) -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Familias de perspectivas -->
    <circle cx="0" cy="-80" r="25" fill="#9370DB" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="-75" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Filosóficas</text>
    
    <circle cx="80" cy="0" r="25" fill="#32CD32" opacity="0.8" filter="url(#glow)"/>
    <text x="80" y="5" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Creativas</text>
    
    <circle cx="0" cy="80" r="25" fill="#FFA500" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="85" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Prácticas</text>
    
    <circle cx="-80" cy="0" r="25" fill="#00CED1" opacity="0.8" filter="url(#glow)"/>
    <text x="-80" y="5" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Analíticas</text>
    
    <!-- Puntos infinitos (muchos puntos pequeños) -->
    <g fill="white" opacity="0.4">
      <circle cx="40" cy="-60" r="2"/>
      <circle cx="60" cy="-40" r="2"/>
      <circle cx="70" cy="-20" r="2"/>
      <circle cx="60" cy="20" r="2"/>
      <circle cx="40" cy="40" r="2"/>
      <circle cx="-40" cy="40" r="2"/>
      <circle cx="-60" cy="20" r="2"/>
      <circle cx="-70" cy="-20" r="2"/>
      <circle cx="-60" cy="-40" r="2"/>
      <circle cx="-40" cy="-60" r="2"/>
      <circle cx="20" cy="-70" r="2"/>
      <circle cx="-20" cy="-70" r="2"/>
      <circle cx="70" cy="40" r="2"/>
      <circle cx="-70" cy="40" r="2"/>
      <circle cx="50" cy="60" r="2"/>
      <circle cx="-50" cy="60" r="2"/>
    </g>
    
    <!-- Centro -->
    <circle cx="0" cy="0" r="10" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="4" text-anchor="middle" fill="#0a0a2e" font-size="7" font-weight="bold">∞</text>
    
    <!-- Etiqueta -->
    <text x="0" y="160" text-anchor="middle" fill="#888" font-size="12" font-family="Arial">
      Esfera de 1000 dimensiones
    </text>
    <text x="0" y="178" text-anchor="middle" fill="#666" font-size="11" font-family="Arial">
      Infinitos puntos, ~6-10 familias
    </text>
  </g>
  
  <!-- ==================== SECCIÓN 2: PROMPT vs PERTURBACIÓN ==================== -->
  <g transform="translate(700, 200)">
    <text x="0" y="-130" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">
      Prompt vs Perturbación
    </text>
    
    <!-- PROMPT: Mover cámara -->
    <g transform="translate(0, -50)">
      <text x="0" y="-20" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="bold" font-family="Arial">
        PROMPT = Mover Cámara
      </text>
      
      <!-- Cámara original -->
      <rect x="-60" y="0" width="40" height="25" rx="3" fill="#FFD700" stroke="white" stroke-width="1"/>
      <circle cx="-40" cy="12" r="6" fill="#1a1a2e"/>
      <text x="-40" y="40" text-anchor="middle" fill="#FFD700" font-size="8">Posición A</text>
      
      <!-- Cámara movida -->
      <rect x="20" y="0" width="40" height="25" rx="3" fill="#FFD700" stroke="white" stroke-width="1"/>
      <circle cx="40" cy="12" r="6" fill="#1a1a2e"/>
      <text x="40" y="40" text-anchor="middle" fill="#FFD700" font-size="8">Posición B</text>
      
      <!-- Flecha -->
      <line x1="-15" y1="12" x2="15" y2="12" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Explicación -->
      <text x="0" y="60" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
        Mismo lente, diferente posición
      </text>
      <text x="0" y="75" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
        Selecciona qué "activar"
      </text>
    </g>
    
    <!-- PERTURBACIÓN: Cambiar lente -->
    <g transform="translate(0, 70)">
      <text x="0" y="-20" text-anchor="middle" fill="#FF6347" font-size="12" font-weight="bold" font-family="Arial">
        PERTURBACIÓN = Cambiar Lente
      </text>
      
      <!-- Cámara con lente original -->
      <rect x="-60" y="0" width="40" height="25" rx="3" fill="#FF6347" stroke="white" stroke-width="1"/>
      <circle cx="-40" cy="12" r="6" fill="#1a1a2e"/>
      <circle cx="-40" cy="12" r="3" fill="#FF6347"/>
      <text x="-40" y="40" text-anchor="middle" fill="#FF6347" font-size="8">Lente Original</text>
      
      <!-- Cámara con lente nuevo -->
      <rect x="20" y="0" width="40" height="25" rx="3" fill="#9370DB" stroke="white" stroke-width="1"/>
      <circle cx="40" cy="12" r="6" fill="#1a1a2e"/>
      <circle cx="40" cy="12" r="3" fill="#9370DB"/>
      <text x="40" y="40" text-anchor="middle" fill="#9370DB" font-size="8">Lente Filosófico</text>
      
      <!-- Flecha -->
      <line x1="-15" y1="12" x2="15" y2="12" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
      
      <!-- Explicación -->
      <text x="0" y="60" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
        Misma posición, diferente óptica
      </text>
      <text x="0" y="75" text-anchor="middle" fill="#888" font-size="9" font-family="Arial">
        Modifica cómo se procesa TODO
      </text>
    </g>
  </g>
  
  <!-- ==================== SECCIÓN 3: EJEMPLO PRÁCTICO ==================== -->
  <g transform="translate(500, 500)">
    <rect x="-400" y="-30" width="800" height="120" fill="#1a1a2e" stroke="#333" stroke-width="1" rx="10"/>
    
    <text x="0" y="-10" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">
      Ejemplo: "The secret to happiness is"
    </text>
    
    <!-- Respuestas -->
    <g transform="translate(-300, 20)">
      <text x="0" y="0" fill="#FFD700" font-size="10" font-weight="bold" font-family="Arial">Baseline:</text>
      <text x="0" y="15" fill="#888" font-size="9" font-family="Arial">"...cultivating gratitude..."</text>
    </g>
    
    <g transform="translate(-100, 20)">
      <text x="0" y="0" fill="#9370DB" font-size="10" font-weight="bold" font-family="Arial">+ Filosófico:</text>
      <text x="0" y="15" fill="#888" font-size="9" font-family="Arial">"...inner peace..."</text>
    </g>
    
    <g transform="translate(100, 20)">
      <text x="0" y="0" fill="#FFA500" font-size="10" font-weight="bold" font-family="Arial">+ Práctico:</text>
      <text x="0" y="15" fill="#888" font-size="9" font-family="Arial">"...daily steps..."</text>
    </g>
    
    <g transform="translate(300, 20)">
      <text x="0" y="0" fill="#32CD32" font-size="10" font-weight="bold" font-family="Arial">+ Creativo:</text>
      <text x="0" y="15" fill="#888" font-size="9" font-family="Arial">"...dancing..."</text>
    </g>
    
    <text x="0" y="90" text-anchor="middle" fill="#666" font-size="10" font-style="italic" font-family="Arial">
      El prompt es el MISMO, pero el LENTE (perturbación) cambia cómo se procesa
    </text>
  </g>
  
  <!-- ==================== LEYENDA INFERIOR ==================== -->
  <g transform="translate(500, 660)">
    <text x="0" y="0" text-anchor="middle" fill="#4a5568" font-size="11" font-family="Arial">
      Prompt = Posición de cámara | Perturbación = Lente de cámara | Infinitas perspectivas, finitas familias
    </text>
  </g>
</svg>
