<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="800" height="600" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="400" y="35" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Arial">
    ¿Qué es una Manifold?
  </text>
  
  <!-- ==================== PASO 1 ==================== -->
  <g transform="translate(200, 120)">
    <text x="0" y="-30" text-anchor="middle" fill="#4ECDC4" font-size="16" font-weight="bold">Paso 1: Imagina una superficie</text>
    
    <!-- Superficie plana -->
    <rect x="-100" y="0" width="200" height="80" fill="#2d3748" stroke="#4ECDC4" stroke-width="2" rx="5"/>
    <text x="0" y="45" text-anchor="middle" fill="#4ECDC4" font-size="11">Superficie 2D</text>
    <text x="0" y="60" text-anchor="middle" fill="#888" font-size="9">(como una mesa)</text>
  </g>
  
  <!-- ==================== PASO 2 ==================== -->
  <g transform="translate(600, 120)">
    <text x="0" y="-30" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">Paso 2: Ahora curva la superficie</text>
    
    <!-- Superficie curva (hoja ondulada) -->
    <path d="M -100 40 Q -50 10 0 35 Q 50 60 100 30" fill="none" stroke="#FFD700" stroke-width="3"/>
    <path d="M -100 60 Q -50 30 0 55 Q 50 80 100 50" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
    <text x="0" y="85" text-anchor="middle" fill="#FFD700" font-size="11">¡Ahora es 3D!</text>
    <text x="0" y="100" text-anchor="middle" fill="#888" font-size="9">(pero sigue siendo una superficie)</text>
  </g>
  
  <!-- ==================== PASO 3: MANIFOLD ==================== -->
  <g transform="translate(400, 300)">
    <text x="0" y="-80" text-anchor="middle" fill="#9370DB" font-size="18" font-weight="bold">Paso 3: Esto es una MANIFOLD</text>
    
    <!-- Manifold 3D (superficie ondulada) -->
    <path d="M -250 20 
             Q -150 -30 -50 10 
             Q 50 50 150 -10 
             Q 200 -40 250 0
             L 250 30
             Q 200 -10 150 20
             Q 50 80 -50 40
             Q -150 0 -250 50 Z" 
          fill="#4ECDC4" fill-opacity="0.3" stroke="#4ECDC4" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#2d3748" stroke-width="1" fill="none">
      <path d="M -230 30 Q -115 -10 0 20 Q 115 50 230 10"/>
      <path d="M -220 40 Q -105 0 10 30 Q 125 60 220 20"/>
      <path d="M -150 -20 Q -130 10 -110 40"/>
      <path d="M -50 10 Q -30 40 -10 70"/>
      <path d="M 50 30 Q 70 60 90 90"/>
      <path d="M 150 -10 Q 170 20 190 50"/>
    </g>
    
    <!-- Puntos en la manifold -->
    <circle cx="0" cy="25" r="12" fill="#FFD700"/>
    <text x="0" y="30" text-anchor="middle" fill="#0a0a2e" font-size="7" font-weight="bold">Tú</text>
    
    <circle cx="-100" cy="10" r="8" fill="#9370DB"/>
    <circle cx="100" cy="0" r="8" fill="#32CD32"/>
    <circle cx="-50" cy="35" r="6" fill="#FF6347"/>
    <circle cx="50" cy="15" r="6" fill="#00CED1"/>
    
    <!-- Etiqueta -->
    <text x="0" y="80" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold">
      MANIFOLD
    </text>
    <text x="0" y="100" text-anchor="middle" fill="#aaa" font-size="11">
      Superficie curva en un espacio de mayor dimensión
    </text>
  </g>
  
  <!-- ==================== EJEMPLO REAL ==================== -->
  <g transform="translate(400, 480)">
    <rect x="-350" y="-30" width="700" height="80" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="10"/>
    
    <text x="0" y="-5" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Ejemplo en un LLM:
    </text>
    
    <text x="0" y="20" text-anchor="middle" fill="#aaa" font-size="11">
      Los pesos del LLM viven en un espacio de 1.1 mil millones de dimensiones
    </text>
    <text x="0" y="40" text-anchor="middle" fill="#aaa" font-size="11">
      Pero las configuraciones COHERENTES forman una superficie (manifold) de ~1000 dimensiones
    </text>
  </g>
  
  <!-- Pie -->
  <text x="400" y="580" text-anchor="middle" fill="#4a5568" font-size="10">
    Manifold = Superficie dentro de un espacio de mayor dimensión
  </text>
</svg>
