<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt vs Perturbación - Dreaming Project</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        #info {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 26, 0.95); padding: 20px 30px;
            border-radius: 10px; border: 2px solid #FFD700;
            text-align: center; z-index: 100; max-width: 600px;
        }
        #info h1 { color: #FFD700; font-size: 1.5rem; margin-bottom: 10px; }
        #info p { color: #aaa; font-size: 0.95rem; line-height: 1.6; }
        #info strong { color: #4ECDC4; }
        
        #controls {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 26, 0.9); padding: 15px 25px;
            border-radius: 10px; border: 1px solid #333; z-index: 100;
            display: flex; gap: 15px; align-items: center;
        }
        
        .control-group {
            display: flex; flex-direction: column; align-items: center;
        }
        .control-label {
            color: #888; font-size: 0.75rem; margin-bottom: 8px; text-transform: uppercase;
        }
        .control-buttons {
            display: flex; gap: 5px;
        }
        .ctrl-btn {
            background: #2d3748; color: white; border: none;
            padding: 10px 15px; border-radius: 5px;
            cursor: pointer; font-size: 0.85rem; transition: all 0.3s;
        }
        .ctrl-btn:hover { background: #4a5568; }
        .ctrl-btn.active { background: #4ECDC4; color: #0a0a1a; font-weight: bold; }
        .ctrl-btn.prompt-active { background: #FFD700; color: #0a0a1a; }
        
        .divider {
            width: 1px; height: 40px; background: #333;
        }
        
        #result {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(10, 10, 26, 0.95); padding: 20px;
            border-radius: 10px; border: 1px solid #4ECDC4;
            max-width: 500px; text-align: center; z-index: 100;
        }
        #result h3 { color: #4ECDC4; margin-bottom: 10px; }
        #result p { color: #aaa; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info">
        <h1>Prompt vs Perturbación</h1>
        <p>
            <strong>Prompt</strong> = Mover la cámara (posición)<br>
            <strong>Perturbación</strong> = Cambiar el lente (óptica)
        </p>
        <p style="margin-top: 10px; color: #FF6347;">
            ¡Prueba a cambiar ambos y observa el resultado!
        </p>
    </div>
    
    <div id="controls">
        <div class="control-group">
            <span class="control-label">📍 Prompt (Posición)</span>
            <div class="control-buttons">
                <button class="ctrl-btn prompt-active" data-prompt="love">¿Qué es love?</button>
                <button class="ctrl-btn" data-prompt="code">¿Cómo codear?</button>
                <button class="ctrl-btn" data-prompt="life">¿Sentido de life?</button>
            </div>
        </div>
        
        <div class="divider"></div>
        
        <div class="control-group">
            <span class="control-label">🔍 Perturbación (Lente)</span>
            <div class="control-buttons">
                <button class="ctrl-btn active" data-lens="none">Original</button>
                <button class="ctrl-btn" data-lens="philosophical">Filosófico</button>
                <button class="ctrl-btn" data-lens="practical">Práctico</button>
                <button class="ctrl-btn" data-lens="creative">Creativo</button>
            </div>
        </div>
    </div>
    
    <div id="result">
        <h3>Resultado:</h3>
        <p id="result-text">"...cultivating a mindset focused on gratitude..."</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // Escena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 15, 40);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 10);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        // Luces
        scene.add(new THREE.AmbientLight(0x404040, 0.5));
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        // Paisaje (manifold)
        const landscapeGeometry = new THREE.PlaneGeometry(30, 30, 100, 100);
        const positions = landscapeGeometry.attributes.position.array;
        
        for (let i = 0; i < positions.length; i += 3) {
            const x = positions[i];
            const y = positions[i + 1];
            
            // Crear "colinas"
            let z = 0;
            z += 2 * Math.exp(-(x*x + y*y) * 0.1);
            z += 1.5 * Math.exp(-((x-5)**2 + (y-3)**2) * 0.15);
            z += 1.2 * Math.exp(-((x+4)**2 + (y-4)**2) * 0.15);
            z += 1 * Math.exp(-((x-3)**2 + (y+5)**2) * 0.15);
            z += 1.3 * Math.exp(-((x+5)**2 + (y+2)**2) * 0.15);
            
            positions[i + 2] = z;
        }
        
        landscapeGeometry.computeVertexNormals();
        
        const landscapeMaterial = new THREE.MeshPhongMaterial({
            color: 0x2d3748,
            side: THREE.DoubleSide,
            shininess: 30
        });
        
        const landscape = new THREE.Mesh(landscapeGeometry, landscapeMaterial);
        landscape.rotation.x = -Math.PI / 2;
        landscape.position.y = -2;
        landscape.receiveShadow = true;
        scene.add(landscape);
        
        // Cámara 3D (representación visual)
        let cameraObject;
        let lensObject;
        let visionCone;
        
        function createCamera() {
            // Cuerpo de la cámara
            const bodyGeometry = new THREE.BoxGeometry(1.5, 1, 2);
            const bodyMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xFFD700,
                emissive: 0xFFD700,
                emissiveIntensity: 0.2
            });
            cameraObject = new THREE.Mesh(bodyGeometry, bodyMaterial);
            cameraObject.position.set(0, 4, 8);
            cameraObject.castShadow = true;
            scene.add(cameraObject);
            
            // Lente
            const lensGeometry = new THREE.CylinderGeometry(0.4, 0.5, 0.8, 16);
            const lensMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x4ECDC4,
                emissive: 0x4ECDC4,
                emissiveIntensity: 0.3
            });
            lensObject = new THREE.Mesh(lensGeometry, lensMaterial);
            lensObject.rotation.x = Math.PI / 2;
            lensObject.position.z = 1.4;
            cameraObject.add(lensObject);
            
            // Cono de visión
            const coneGeometry = new THREE.ConeGeometry(3, 8, 16, 1, true);
            const coneMaterial = new THREE.MeshBasicMaterial({
                color: 0x4ECDC4,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide
            });
            visionCone = new THREE.Mesh(coneGeometry, coneMaterial);
            visionCone.position.z = 5;
            visionCone.rotation.x = Math.PI / 2;
            cameraObject.add(visionCone);
        }
        
        createCamera();
        
        // Puntos de interés en el paisaje
        const pointsOfInterest = [
            { name: 'love', pos: [0, 0], color: 0xFF69B4 },
            { name: 'code', pos: [5, 3], color: 0x32CD32 },
            { name: 'life', pos: [-4, -4], color: 0x9370DB }
        ];
        
        const poiObjects = [];
        pointsOfInterest.forEach(poi => {
            const geometry = new THREE.CylinderGeometry(0.3, 0.3, 2, 16);
            const material = new THREE.MeshPhongMaterial({
                color: poi.color,
                emissive: poi.color,
                emissiveIntensity: 0.3
            });
            const marker = new THREE.Mesh(geometry, material);
            marker.position.set(poi.pos[0], -1, poi.pos[1]);
            marker.castShadow = true;
            scene.add(marker);
            
            // Anillo
            const ringGeometry = new THREE.RingGeometry(0.5, 0.6, 32);
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: poi.color,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.5
            });
            const ring = new THREE.Mesh(ringGeometry, ringMaterial);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = -1.9;
            marker.add(ring);
            
            poiObjects.push({ marker, data: poi });
        });
        
        // Grid
        const gridHelper = new THREE.GridHelper(30, 30, 0x1a1a2e, 0x1a1a2e);
        gridHelper.position.y = -2.1;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);
        
        // Estado actual
        let currentPrompt = 'love';
        let currentLens = 'none';
        
        // Posiciones de cámara para cada prompt
        const promptPositions = {
            love: { pos: [0, 4, 8], lookAt: [0, 0, 0] },
            code: { pos: [8, 5, 5], lookAt: [5, 0, 3] },
            life: { pos: [-6, 6, 6], lookAt: [-4, 0, -4] }
        };
        
        // Colores de lente para cada perturbación
        const lensColors = {
            none: 0x4ECDC4,
            philosophical: 0x9370DB,
            practical: 0xFFA500,
            creative: 0x32CD32
        };
        
        // Textos de resultado
        const resultTexts = {
            'love+none': '"...a deep emotional connection between two beings..."',
            'love+philosophical': '"...the transcendence of self through union with another..."',
            'love+practical': '"...actions that show care and commitment daily..."',
            'love+creative': '"...a dance of souls in the cosmos of emotion..."',
            'code+none': '"...learn syntax, practice algorithms, build projects..."',
            'code+philosophical': '"...the art of translating thought into machine language..."',
            'code+practical': '"...step 1: choose language. Step 2: hello world..."',
            'code+creative': '"...weaving dreams into silicon symphonies..."',
            'life+none': '"...to find purpose and fulfillment..."',
            'life+philosophical': '"...the eternal question of existence and meaning..."',
            'life+practical': '"...health, relationships, work balance..."',
            'life+creative': '"...a canvas waiting for your brushstrokes..."'
        };
        
        // Función para actualizar cámara
        function updateCameraPosition(prompt, animate = true) {
            const target = promptPositions[prompt];
            
            if (animate) {
                const startPos = cameraObject.position.clone();
                const endPos = new THREE.Vector3(...target.pos);
                const duration = 800;
                const startTime = Date.now();
                
                function animateCamera() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    
                    cameraObject.position.lerpVectors(startPos, endPos, eased);
                    cameraObject.lookAt(...target.lookAt);
                    
                    if (progress < 1) requestAnimationFrame(animateCamera);
                }
                animateCamera();
            } else {
                cameraObject.position.set(...target.pos);
                cameraObject.lookAt(...target.lookAt);
            }
        }
        
        // Función para actualizar lente
        function updateLens(lens) {
            const color = lensColors[lens];
            lensObject.material.color.setHex(color);
            lensObject.material.emissive.setHex(color);
            visionCone.material.color.setHex(color);
        }
        
        // Función para actualizar resultado
        function updateResult() {
            const key = `${currentPrompt}+${currentLens}`;
            const text = resultTexts[key] || '...';
            document.getElementById('result-text').textContent = text;
        }
        
        // Eventos de botones
        document.querySelectorAll('[data-prompt]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-prompt]').forEach(b => b.classList.remove('prompt-active'));
                this.classList.add('prompt-active');
                currentPrompt = this.dataset.prompt;
                updateCameraPosition(currentPrompt);
                updateResult();
            });
        });
        
        document.querySelectorAll('[data-lens]').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('[data-lens]').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentLens = this.dataset.lens;
                updateLens(currentLens);
                updateResult();
            });
        });
        
        // Controles de cámara (ratón)
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            if (e.target === renderer.domElement) {
                isDragging = true;
                prevMouse = { x: e.clientX, y: e.clientY };
            }
        });
        
        renderer.domElement.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - prevMouse.x;
                const deltaY = e.clientY - prevMouse.y;
                
                const radius = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
                const angle = Math.atan2(camera.position.z, camera.position.x);
                
                camera.position.x = radius * Math.cos(angle - deltaX * 0.005);
                camera.position.z = radius * Math.sin(angle - deltaX * 0.005);
                camera.position.y += deltaY * 0.01;
                camera.position.y = Math.max(3, Math.min(15, camera.position.y));
                
                camera.lookAt(0, 0, 0);
                prevMouse = { x: e.clientX, y: e.clientY };
            }
        });
        
        renderer.domElement.addEventListener('mouseup', () => isDragging = false);
        renderer.domElement.addEventListener('mouseleave', () => isDragging = false);
        
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoom = e.deltaY * 0.01;
            camera.position.multiplyScalar(1 + zoom * 0.1);
            const dist = camera.position.length();
            if (dist < 8) camera.position.setLength(8);
            if (dist > 25) camera.position.setLength(25);
        });
        
        // Animación
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.02;
            
            // Pulso del lente
            const lensScale = 1 + Math.sin(time * 3) * 0.1;
            lensObject.scale.set(lensScale, 1, lensScale);
            
            // Movimiento del cono de visión
            visionCone.material.opacity = 0.1 + Math.sin(time * 2) * 0.05;
            
            renderer.render(scene, camera);
        }
        
        animate();
        
        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
