<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="ideaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="1400" height="800" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="700" y="40" text-anchor="middle" fill="white" font-size="28" font-weight="bold">
    ¿Dónde Viven las "Ideas Puras"?
  </text>
  <text x="700" y="70" text-anchor="middle" fill="#FFD700" font-size="14">
    "Conceptos sin idioma, sin sintaxis, sin ruido"
  </text>
  
  <!-- ==================== ANATOMÍA DEL LLM ==================== -->
  <g transform="translate(200, 350)">
    <text x="0" y="-200" text-anchor="middle" fill="#4ECDC4" font-size="16" font-weight="bold">
      Anatomía del LLM
    </text>
    
    <!-- Capas -->
    <rect x="-80" y="-180" width="160" height="60" fill="#FF6347" opacity="0.5" stroke="#FF6347" stroke-width="2" rx="5"/>
    <text x="0" y="-155" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Capa 1-5</text>
    <text x="0" y="-135" text-anchor="middle" fill="#aaa" font-size="10">Sintaxis</text>
    <text x="0" y="-120" text-anchor="middle" fill="#aaa" font-size="9">"suject + verb + object"</text>
    
    <rect x="-80" y="-110" width="160" height="60" fill="#9370DB" opacity="0.5" stroke="#9370DB" stroke-width="2" rx="5"/>
    <text x="0" y="-85" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Capa 6-12</text>
    <text x="0" y="-65" text-anchor="middle" fill="#aaa" font-size="10">Significado</text>
    <text x="0" y="-50" text-anchor="middle" fill="#FFD700" font-size="9" font-weight="bold">← IDEAS PURAS</text>
    
    <rect x="-80" y="-40" width="160" height="60" fill="#4ECDC4" opacity="0.5" stroke="#4ECDC4" stroke-width="2" rx="5"/>
    <text x="0" y="-15" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Capa 13-18</text>
    <text x="0" y="5" text-anchor="middle" fill="#aaa" font-size="10">Razonamiento</text>
    <text x="0" y="20" text-anchor="middle" fill="#aaa" font-size="9">"si A entonces B"</text>
    
    <rect x="-80" y="30" width="160" height="60" fill="#FF69B4" opacity="0.5" stroke="#FF69B4" stroke-width="2" rx="5"/>
    <text x="0" y="55" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Capa 19-22</text>
    <text x="0" y="75" text-anchor="middle" fill="#aaa" font-size="10">Generación</text>
    <text x="0" y="90" text-anchor="middle" fill="#aaa" font-size="9">"siguiente token"</text>
    
    <!-- Flecha de flujo -->
    <line x1="0" y1="-120" x2="0" y2="95" stroke="#FFD700" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="25" y="-15" fill="#FFD700" font-size="12">↓</text>
  </g>
  
  <!-- ==================== LAS IDEAS PURAS ==================== -->
  <g transform="translate(700, 350)">
    <text x="0" y="-200" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">
      Las Ideas Puras (Capas 6-12)
    </text>
    
    <!-- Ideas como estrellas -->
    <circle cx="0" cy="-150" r="30" fill="#FFD700" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="-145" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">Tristeza</text>
    <text x="0" y="-132" text-anchor="middle" fill="#0a0a2e" font-size="8">feature_42</text>
    
    <circle cx="-100" cy="-100" r="25" fill="#4ECDC4" opacity="0.8" filter="url(#glow)"/>
    <text x="-100" y="-95" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">Golden Gate</text>
    <text x="-100" y="-82" text-anchor="middle" fill="#0a0a2e" font-size="8">feature_108</text>
    
    <circle cx="100" cy="-100" r="25" fill="#FF69B4" opacity="0.8" filter="url(#glow)"/>
    <text x="100" y="-95" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">Código</text>
    <text x="100" y="-82" text-anchor="middle" fill="#0a0a2e" font-size="8">feature_256</text>
    
    <circle cx="-60" cy="-20" r="20" fill="#9370DB" opacity="0.8" filter="url(#glow)"/>
    <text x="-60" y="-15" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Filosofía</text>
    
    <circle cx="60" cy="-20" r="20" fill="#FFA500" opacity="0.8" filter="url(#glow)"/>
    <text x="60" y="-15" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold">Amor</text>
    
    <circle cx="0" cy="40" r="18" fill="#32CD32" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="45" text-anchor="middle" fill="#0a0a2e" font-size="9" font-weight="bold">Miedo</text>
    
    <circle cx="-100" cy="60" r="15" fill="#FF6347" opacity="0.8" filter="url(#glow)"/>
    <text x="-100" y="65" text-anchor="middle" fill="white" font-size="8" font-weight="bold">Ira</text>
    
    <circle cx="100" cy="60" r="15" fill="#00CED1" opacity="0.8" filter="url(#glow)"/>
    <text x="100" y="65" text-anchor="middle" fill="#0a0a2e" font-size="8" font-weight="bold">Alegría</text>
    
    <circle cx="0" cy="100" r="15" fill="#FFD700" opacity="0.8" filter="url(#glow)"/>
    <text x="0" y="105" text-anchor="middle" fill="#0a0a2e" font-size="8" font-weight="bold">San Francisco</text>
    
    <!-- Conexiones entre ideas -->
    <line x1="0" y1="-150" x2="-100" y2="-100" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="-150" x2="100" y2="-100" stroke="#FFD700" stroke-width="1" opacity="0.3"/>
    <line x1="-100" y1="-100" x2="-60" y2="-20" stroke="#4ECDC4" stroke-width="1" opacity="0.3"/>
    <line x1="100" y1="-100" x2="60" y2="-20" stroke="#FF69B4" stroke-width="1" opacity="0.3"/>
    <line x1="-60" y1="-20" x2="60" y2="-20" stroke="#9370DB" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="40" x2="-60" y2="-20" stroke="#32CD32" stroke-width="1" opacity="0.3"/>
    <line x1="0" y1="40" x2="60" y2="-20" stroke="#32CD32" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- ==================== CÓMO LOCALIZARLAS ==================== -->
  <g transform="translate(1150, 350)">
    <text x="0" y="-200" text-anchor="middle" fill="#FF69B4" font-size="16" font-weight="bold">
      Cómo Localizarlas
    </text>
    
    <rect x="-130" y="-180" width="260" height="350" fill="#1a1a2e" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <!-- Método 1 -->
    <g transform="translate(-110, -150)">
      <circle cx="15" cy="0" r="12" fill="#4ECDC4"/>
      <text x="15" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">1</text>
      <text x="40" y="5" fill="white" font-size="11" font-weight="bold">Autoencoder</text>
      <text x="40" y="22" fill="#aaa" font-size="9">Entrenar para extraer</text>
      <text x="40" y="37" fill="#aaa" font-size="9">features monosemánticas</text>
    </g>
    
    <!-- Método 2 -->
    <g transform="translate(-110, -80)">
      <circle cx="15" cy="0" r="12" fill="#9370DB"/>
      <text x="15" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">2</text>
      <text x="40" y="5" fill="white" font-size="11" font-weight="bold">Probe</text>
      <text x="40" y="22" fill="#aaa" font-size="9">Entrenar clasificador</text>
      <text x="40" y="37" fill="#aaa" font-size="9">para detectar conceptos</text>
    </g>
    
    <!-- Método 3 -->
    <g transform="translate(-110, -10)">
      <circle cx="15" cy="0" r="12" fill="#FFA500"/>
      <text x="15" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">3</text>
      <text x="40" y="5" fill="white" font-size="11" font-weight="bold">Perturbación</text>
      <text x="40" y="22" fill="#aaa" font-size="9">Cambiar pesos y ver</text>
      <text x="40" y="37" fill="#aaa" font-size="9">qué概念 cambia</text>
    </g>
    
    <!-- Método 4 -->
    <g transform="translate(-110, 60)">
      <circle cx="15" cy="0" r="12" fill="#FF6347"/>
      <text x="15" y="4" text-anchor="middle" fill="white" font-size="10" font-weight="bold">4</text>
      <text x="40" y="5" fill="white" font-size="11" font-weight="bold">Ablation</text>
      <text x="40" y="22" fill="#aaa" font-size="9">Eliminar neuronas y ver</text>
      <text x="40" y="37" fill="#aaa" font-size="9">qué概念 desaparece</text>
    </g>
    
    <!-- Método 5 -->
    <g transform="translate(-110, 140)">
      <circle cx="15" cy="0" r="12" fill="#FFD700"/>
      <text x="15" y="4" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">5</text>
      <text x="40" y="5" fill="white" font-size="11" font-weight="bold">Nuestro Método</text>
      <text x="40" y="22" fill="#aaa" font-size="9">Perturbación + Análisis</text>
      <text x="40" y="37" fill="#aaa" font-size="9">de perspectivas</text>
    </g>
  </g>
  
  <!-- ==================== CONEXIÓN CON NUESTRO TRABAJO ==================== -->
  <g transform="translate(700, 700)">
    <rect x="-500" y="-40" width="1000" height="90" fill="#0d1117" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-10" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Conexión con Nuestro Trabajo
    </text>
    
    <text x="0" y="15" text-anchor="middle" fill="white" font-size="12">
      Nosotros: Perturbamos → El modelo cambia de "perspectiva"
    </text>
    
    <text x="0" y="40" text-anchor="middle" fill="#aaa" font-size="11">
      "Perspectiva filosófica" = activar más la feature "filosofía" y menos la feature "práctica"
    </text>
  </g>
</svg>
