<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="clusterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="800" y="40" text-anchor="middle" fill="white" font-size="28" font-weight="bold">
    Mapa Completo de Perspectivas
  </text>
  <text x="800" y="70" text-anchor="middle" fill="#4ECDC4" font-size="14">
    1152 dimensiones × infinitas magnitudes = infinitas perspectivas
  </text>
  
  <!-- ==================== ESFERA PRINCIPAL ==================== -->
  <g transform="translate(500, 500)">
    <!-- Esfera base -->
    <circle cx="0" cy="0" r="300" fill="none" stroke="#4a5568" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- Punto central -->
    <circle cx="0" cy="0" r="20" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#0a0a2e" font-size="12" font-weight="bold">PUNTO</text>
    <text x="0" y="35" text-anchor="middle" fill="#FFD700" font-size="10">Base</text>
    
    <!-- Familias de perspectivas (clusters) -->
    <!-- Familia 1: Filosófica -->
    <circle cx="-200" cy="-150" r="60" fill="#9370DB" opacity="0.3"/>
    <circle cx="-200" cy="-150" r="8" fill="#9370DB" filter="url(#glow)"/>
    <text x="-200" y="-145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">FIL</text>
    <text x="-200" y="-130" text-anchor="middle" fill="#aaa" font-size="8">42 perspectivas</text>
    <line x1="0" y1="0" x2="-200" y2="-150" stroke="#9370DB" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 2: Práctica -->
    <circle cx="200" cy="-150" r="55" fill="#FFA500" opacity="0.3"/>
    <circle cx="200" cy="-150" r="8" fill="#FFA500" filter="url(#glow)"/>
    <text x="200" y="-145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">PRA</text>
    <text x="200" y="-130" text-anchor="middle" fill="#aaa" font-size="8">38 perspectivas</text>
    <line x1="0" y1="0" x2="200" y2="-150" stroke="#FFA500" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 3: Creativa -->
    <circle cx="250" cy="50" r="50" fill="#FF69B4" opacity="0.3"/>
    <circle cx="250" cy="50" r="8" fill="#FF69B4" filter="url(#glow)"/>
    <text x="250" y="55" text-anchor="middle" fill="white" font-size="10" font-weight="bold">CRE</text>
    <text x="250" y="70" text-anchor="middle" fill="#aaa" font-size="8">35 perspectivas</text>
    <line x1="0" y1="0" x2="250" y2="50" stroke="#FF69B4" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 4: Estoica -->
    <circle cx="-250" cy="50" r="45" fill="#00CED1" opacity="0.3"/>
    <circle cx="-250" cy="50" r="8" fill="#00CED1" filter="url(#glow)"/>
    <text x="-250" y="55" text-anchor="middle" fill="white" font-size="10" font-weight="bold">EST</text>
    <text x="-250" y="70" text-anchor="middle" fill="#aaa" font-size="8">32 perspectivas</text>
    <line x1="0" y1="0" x2="-250" y2="50" stroke="#00CED1" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 5: Espiritual -->
    <circle cx="0" cy="-250" r="48" fill="#FFD700" opacity="0.3"/>
    <circle cx="0" cy="-250" r="8" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="-245" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">ESPI</text>
    <text x="0" y="-230" text-anchor="middle" fill="#aaa" font-size="8">40 perspectivas</text>
    <line x1="0" y1="0" x2="0" y2="-250" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 6: Auténtica -->
    <circle cx="0" cy="250" r="42" fill="#32CD32" opacity="0.3"/>
    <circle cx="0" cy="250" r="8" fill="#32CD32" filter="url(#glow)"/>
    <text x="0" y="255" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">AUT</text>
    <text x="0" y="270" text-anchor="middle" fill="#aaa" font-size="8">28 perspectivas</text>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#32CD32" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 7: Analítica -->
    <circle cx="-180" cy="180" r="38" fill="#FF6347" opacity="0.3"/>
    <circle cx="-180" cy="180" r="8" fill="#FF6347" filter="url(#glow)"/>
    <text x="-180" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="bold">ANA</text>
    <text x="-180" y="200" text-anchor="middle" fill="#aaa" font-size="8">25 perspectivas</text>
    <line x1="0" y1="0" x2="-180" y2="180" stroke="#FF6347" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 8: Lírica -->
    <circle cx="180" cy="180" r="35" fill="#DDA0DD" opacity="0.3"/>
    <circle cx="180" cy="180" r="8" fill="#DDA0DD" filter="url(#glow)"/>
    <text x="180" y="185" text-anchor="middle" fill="white" font-size="10" font-weight="bold">LIR</text>
    <text x="180" y="200" text-anchor="middle" fill="#aaa" font-size="8">22 perspectivas</text>
    <line x1="0" y1="0" x2="180" y2="180" stroke="#DDA0DD" stroke-width="2" opacity="0.5"/>
    
    <!-- Familia 9: Concisa -->
    <circle cx="-100" cy="-220" r="30" fill="#FF4500" opacity="0.3"/>
    <circle cx="-100" cy="-220" r="6" fill="#FF4500" filter="url(#glow)"/>
    <text x="-100" y="-215" text-anchor="middle" fill="white" font-size="9" font-weight="bold">CON</text>
    <line x1="0" y1="0" x2="-100" y2="-220" stroke="#FF4500" stroke-width="1" opacity="0.5"/>
    
    <!-- Familia 10: Mística -->
    <circle cx="100" cy="-220" r="30" fill="#8B008B" opacity="0.3"/>
    <circle cx="100" cy="-220" r="6" fill="#8B008B" filter="url(#glow)"/>
    <text x="100" y="-215" text-anchor="middle" fill="white" font-size="9" font-weight="bold">MIS</text>
    <line x1="0" y1="0" x2="100" y2="-220" stroke="#8B008B" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- ==================== LEYENDA ==================== -->
  <g transform="translate(1200, 300)">
    <rect x="-180" y="-50" width="360" height="400" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="2" rx="15"/>
    
    <text x="0" y="-20" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold">
      Familias de Perspectivas
    </text>
    
    <!-- Lista de familias -->
    <g transform="translate(-160, 10)">
      <circle cx="10" cy="0" r="6" fill="#9370DB"/>
      <text x="25" y="4" fill="white" font-size="10">Filosófica (42)</text>
      
      <circle cx="10" cy="30" r="6" fill="#FFA500"/>
      <text x="25" y="34" fill="white" font-size="10">Práctica (38)</text>
      
      <circle cx="10" cy="60" r="6" fill="#FF69B4"/>
      <text x="25" y="64" fill="white" font-size="10">Creativa (35)</text>
      
      <circle cx="10" cy="90" r="6" fill="#00CED1"/>
      <text x="25" y="94" fill="white" font-size="10">Estoica (32)</text>
      
      <circle cx="10" cy="120" r="6" fill="#FFD700"/>
      <text x="25" y="124" fill="white" font-size="10">Espiritual (40)</text>
      
      <circle cx="10" cy="150" r="6" fill="#32CD32"/>
      <text x="25" y="154" fill="white" font-size="10">Auténtica (28)</text>
      
      <circle cx="10" cy="180" r="6" fill="#FF6347"/>
      <text x="25" y="184" fill="white" font-size="10">Analítica (25)</text>
      
      <circle cx="10" cy="210" r="6" fill="#DDA0DD"/>
      <text x="25" y="214" fill="white" font-size="10">Lírica (22)</text>
      
      <circle cx="10" cy="240" r="5" fill="#FF4500"/>
      <text x="25" y="244" fill="white" font-size="10">Concisa (~20)</text>
      
      <circle cx="10" cy="270" r="5" fill="#8B008B"/>
      <text x="25" y="274" fill="white" font-size="10">Mística (~20)</text>
    </g>
    
    <!-- Total -->
    <line x1="-160" y1="300" x2="160" y2="300" stroke="#4ECDC4" stroke-width="1"/>
    <text x="0" y="325" text-anchor="middle" fill="#FFD700" font-size="12" font-weight="bold">
      Total: ~300 perspectivas distinguibles
    </text>
  </g>
  
  <!-- ==================== FÓRMULA ==================== -->
  <g transform="translate(800, 900)">
    <rect x="-500" y="-30" width="1000" height="70" fill="#0d1117" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-5" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Fórmula del Espacio de Perspectivas
    </text>
    
    <text x="0" y="25" text-anchor="middle" fill="white" font-size="12">
      Perspectivas = S^{1151} (esfera de dimensión 1151)
    </text>
    
    <text x="0" y="50" text-anchor="middle" fill="#4ECDC4" font-size="11">
      Cada punto en la esfera = una perspectiva única
    </text>
  </g>
</svg>
