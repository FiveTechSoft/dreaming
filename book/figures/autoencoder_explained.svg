<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1400" height="700" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="700" y="40" text-anchor="middle" fill="white" font-size="28" font-weight="bold">
    ¿Qué es un Autoencoder?
  </text>
  <text x="700" y="70" text-anchor="middle" fill="#4ECDC4" font-size="14">
    "Un filtro que extrae lo esencial"
  </text>
  
  <!-- ==================== ANALOGÍA SIMPLE ==================== -->
  <g transform="translate(700, 150)">
    <rect x="-450" y="-30" width="900" height="80" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-5" text-anchor="middle" fill="#FFD700" font-size="16" font-weight="bold">
      La Analogía: Resumen de un Libro
    </text>
    
    <text x="0" y="25" text-anchor="middle" fill="#aaa" font-size="12">
      Libro entero (1000 páginas) → Resumen (1 página) → Reconstrucción (~950 páginas)
    </text>
  </g>
  
  <!-- ==================== ARQUITECTURA ==================== -->
  <g transform="translate(700, 320)">
    <text x="0" y="-120" text-anchor="middle" fill="white" font-size="18" font-weight="bold">
      Arquitectura del Autoencoder
    </text>
    
    <!-- ENTRADA -->
    <rect x="-500" y="-80" width="150" height="180" fill="#4ECDC4" opacity="0.3" stroke="#4ECDC4" stroke-width="2" rx="10"/>
    <text x="-425" y="-50" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold">ENTRADA</text>
    <text x="-425" y="-30" text-anchor="middle" fill="white" font-size="11">2048 dims</text>
    <text x="-425" y="-10" text-anchor="middle" fill="#aaa" font-size="10">(activaciones)</text>
    <text x="-425" y="20" text-anchor="middle" fill="#aaa" font-size="10">1 millón</text>
    <text x="-425" y="35" text-anchor="middle" fill="#aaa" font-size="10">neuronas</text>
    <text x="-425" y="60" text-anchor="middle" fill="#FF6347" font-size="10">¡CAOS!</text>
    
    <!-- FLECHA -->
    <text x="-275" y="10" fill="#FFD700" font-size="30">→</text>
    
    <!-- CODIFICADOR -->
    <rect x="-250" y="-80" width="120" height="180" fill="#9370DB" opacity="0.3" stroke="#9370DB" stroke-width="2" rx="10"/>
    <text x="-190" y="-50" text-anchor="middle" fill="#9370DB" font-size="14" font-weight="bold">CODIFICADOR</text>
    <text x="-190" y="-30" text-anchor="middle" fill="white" font-size="10">2048 → 1000</text>
    <text x="-190" y="-10" text-anchor="middle" fill="white" font-size="10">2048 → 500</text>
    <text x="-190" y="10" text-anchor="middle" fill="white" font-size="10">500 → 100</text>
    <text x="-190" y="40" text-anchor="middle" fill="#aaa" font-size="9">Comprime</text>
    <text x="-190" y="55" text-anchor="middle" fill="#aaa" font-size="9">lo esencial</text>
    
    <!-- FLECHA -->
    <text x="-95" y="10" fill="#FFD700" font-size="30">→</text>
    
    <!-- BOTOTTLENECK (CUELLO DE BOTELLA) -->
    <rect x="-75" y="-80" width="150" height="180" fill="#FFD700" opacity="0.3" stroke="#FFD700" stroke-width="3" rx="10"/>
    <text x="0" y="-50" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">CUELLO</text>
    <text x="0" y="-30" text-anchor="middle" fill="white" font-size="12" font-weight="bold">100 features</text>
    <text x="0" y="-10" text-anchor="middle" fill="#aaa" font-size="10">(de 2048 originales)</text>
    <text x="0" y="20" text-anchor="middle" fill="white" font-size="10">→ feature_1: "Golden Gate"</text>
    <text x="0" y="35" text-anchor="middle" fill="white" font-size="10">→ feature_2: "tristeza"</text>
    <text x="0" y="50" text-anchor="middle" fill="white" font-size="10">→ feature_3: "código"</text>
    <text x="0" y="70" text-anchor="middle" fill="#FF69B4" font-size="11" font-weight="bold">¡MONOSEMÁNTICO!</text>
    
    <!-- FLECHA -->
    <text x="110" y="10" fill="#FFD700" font-size="30">→</text>
    
    <!-- DECODIFICADOR -->
    <rect x="130" y="-80" width="120" height="180" fill="#9370DB" opacity="0.3" stroke="#9370DB" stroke-width="2" rx="10"/>
    <text x="190" y="-50" text-anchor="middle" fill="#9370DB" font-size="14" font-weight="bold">DECODIFICADOR</text>
    <text x="190" y="-30" text-anchor="middle" fill="white" font-size="10">100 → 500</text>
    <text x="190" y="-10" text-anchor="middle" fill="white" font-size="10">500 → 2048</text>
    <text x="190" y="10" text-anchor="middle" fill="white" font-size="10">2048 → 2048</text>
    <text x="190" y="40" text-anchor="middle" fill="#aaa" font-size="9">Reconstruye</text>
    <text x="190" y="55" text-anchor="middle" fill="#aaa" font-size="9">lo esencial</text>
    
    <!-- FLECHA -->
    <text x="285" y="10" fill="#FFD700" font-size="30">→</text>
    
    <!-- SALIDA -->
    <rect x="310" y="-80" width="150" height="180" fill="#32CD32" opacity="0.3" stroke="#32CD32" stroke-width="2" rx="10"/>
    <text x="385" y="-50" text-anchor="middle" fill="#32CD32" font-size="14" font-weight="bold">SALIDA</text>
    <text x="385" y="-30" text-anchor="middle" fill="white" font-size="11">2048 dims</text>
    <text x="385" y="-10" text-anchor="middle" fill="#aaa" font-size="10">(activaciones)</text>
    <text x="385" y="20" text-anchor="middle" fill="#aaa" font-size="10">~95% igual</text>
    <text x="385" y="35" text-anchor="middle" fill="#aaa" font-size="10">al original</text>
    <text x="385" y="60" text-anchor="middle" fill="#32CD32" font-size="10">¡LIMPIO!</text>
  </g>
  
  <!-- ==================== EJEMPLO ==================== -->
  <g transform="translate(700, 560)">
    <text x="0" y="-60" text-anchor="middle" fill="white" font-size="16" font-weight="bold">
      Ejemplo concreto
    </text>
    
    <rect x="-450" y="-40" width="900" height="100" fill="#1a1a2e" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <text x="-350" y="-10" fill="#4ECDC4" font-size="12" font-weight="bold">Entrada:</text>
    <text x="-350" y="10" fill="white" font-size="10">"me siento triste hoy"</text>
    <text x="-350" y="30" fill="#aaa" font-size="9">→ 2048 dimensiones activadas</text>
    
    <text x="0" y="10" fill="#FFD700" font-size="20">→</text>
    <text x="0" y="30" fill="#FFD700" font-size="10" text-anchor="middle">AUTOENCODER</text>
    
    <text x="350" y="-10" fill="#FF69B4" font-size="12" font-weight="bold">Features:</text>
    <text x="350" y="10" fill="white" font-size="10">feature_42: "tristeza" = 0.9</text>
    <text x="350" y="30" fill="white" font-size="10">feature_108: "emoción" = 0.7</text>
    <text x="350" y="50" fill="#aaa" font-size="9">→ Solo 2 features (de 1000 posibles)</text>
  </g>
  
  <!-- ==================== SPARSE AUTOENCODER ==================== -->
  <g transform="translate(700, 660)">
    <rect x="-450" y="-20" width="900" height="50" fill="#FF6347" opacity="0.3" stroke="#FF6347" stroke-width="2" rx="10"/>
    
    <text x="0" y="10" text-anchor="middle" fill="#FF6347" font-size="14" font-weight="bold">
      Sparse Autoencoder: + dispersidad → features más limpias
    </text>
  </g>
</svg>
