<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <linearGradient id="weightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="600" y="40" text-anchor="middle" fill="white" font-size="24" font-weight="bold" font-family="Arial">
    ¿Dónde se Guarda la Atención?
  </text>
  <text x="600" y="65" text-anchor="middle" fill="#FFD700" font-size="14" font-family="Arial">
    "En los pesos: Q (Query), K (Key), V (Value)"
  </text>
  
  <!-- ==================== SECCIÓN 1: DÓNDE ESTÁN ==================== -->
  <g transform="translate(350, 200)">
    <text x="0" y="-100" text-anchor="middle" fill="#4ECDC4" font-size="18" font-weight="bold">
      1. La Atención = 3 Matrices de Pesos
    </text>
    
    <!-- Bloque de atención -->
    <rect x="-200" y="-80" width="400" height="200" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="2" rx="15"/>
    
    <!-- Q (Query) -->
    <g transform="translate(-120, -30)">
      <rect x="0" y="0" width="100" height="60" fill="#FF6B6B" rx="8"/>
      <text x="50" y="25" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Q</text>
      <text x="50" y="45" text-anchor="middle" fill="#ffcccc" font-size="9">Query</text>
      <text x="50" y="80" text-anchor="middle" fill="#888" font-size="8">"¿Qué busco?"</text>
    </g>
    
    <!-- K (Key) -->
    <g transform="translate(-10, -30)">
      <rect x="0" y="0" width="100" height="60" fill="#32CD32" rx="8"/>
      <text x="50" y="25" text-anchor="middle" fill="white" font-size="16" font-weight="bold">K</text>
      <text x="50" y="45" text-anchor="middle" fill="#ccffcc" font-size="9">Key</text>
      <text x="50" y="80" text-anchor="middle" fill="#888" font-size="8">"¿Qué ofrezco?"</text>
    </g>
    
    <!-- V (Value) -->
    <g transform="translate(100, -30)">
      <rect x="0" y="0" width="100" height="60" fill="#4ECDC4" rx="8"/>
      <text x="50" y="25" text-anchor="middle" fill="white" font-size="16" font-weight="bold">V</text>
      <text x="50" y="45" text-anchor="middle" fill="#ccffff" font-size="9">Value</text>
      <text x="50" y="80" text-anchor="middle" fill="#888" font-size="8">"¿Qué entrego?"</text>
    </g>
    
    <!-- Fórmula -->
    <text x="0" y="100" text-anchor="middle" fill="#FFD700" font-size="12" font-family="monospace">
      Attention(Q, K, V) = softmax(Q·Kᵀ/√d) · V
    </text>
  </g>
  
  <!-- ==================== SECCIÓN 2: FÓRMULA EXPLICADA ==================== -->
  <g transform="translate(600, 450)">
    <text x="0" y="-100" text-anchor="middle" fill="#9370DB" font-size="18" font-weight="bold">
      2. ¿Cómo se Calcula?
    </text>
    
    <rect x="-400" y="-80" width="800" height="200" fill="#1a1a2e" stroke="#9370DB" stroke-width="2" rx="15"/>
    
    <!-- Paso 1: Q·K -->
    <g transform="translate(-320, -40)">
      <rect x="0" y="0" width="150" height="80" fill="#2d3748" rx="8"/>
      <text x="75" y="25" text-anchor="middle" fill="#FF6B6B" font-size="12" font-weight="bold">Paso 1: Q · Kᵀ</text>
      <text x="75" y="50" text-anchor="middle" fill="#aaa" font-size="9">Calcular "quién conecta</text>
      <text x="75" y="65" text-anchor="middle" fill="#aaa" font-size="9">con quién"</text>
    </g>
    
    <!-- Flecha -->
    <text x="-145" y="10" fill="#888" font-size="16">→</text>
    
    <!-- Paso 2: Softmax -->
    <g transform="translate(-100, -40)">
      <rect x="0" y="0" width="150" height="80" fill="#2d3748" rx="8"/>
      <text x="75" y="25" text-anchor="middle" fill="#32CD32" font-size="12" font-weight="bold">Paso 2: Softmax</text>
      <text x="75" y="50" text-anchor="middle" fill="#aaa" font-size="9">Convertir en pesos</text>
      <text x="75" y="65" text-anchor="middle" fill="#aaa" font-size="9">(0 a 1)</text>
    </g>
    
    <!-- Flecha -->
    <text x="65" y="10" fill="#888" font-size="16">→</text>
    
    <!-- Paso 3: ·V -->
    <g transform="translate(120, -40)">
      <rect x="0" y="0" width="150" height="80" fill="#2d3748" rx="8"/>
      <text x="75" y="25" text-anchor="middle" fill="#4ECDC4" font-size="12" font-weight="bold">Paso 3: Pesos · V</text>
      <text x="75" y="50" text-anchor="middle" fill="#aaa" font-size="9">Entregar información</text>
      <text x="75" y="65" text-anchor="middle" fill="#aaa" font-size="9">ponderada</text>
    </g>
    
    <text x="0" y="120" text-anchor="middle" fill="#888" font-size="10">
      Todo esto son OPERACIONES MATEMÁTICAS sobre los PESOS Q, K, V
    </text>
  </g>
  
  <!-- ==================== SECCIÓN 3: EJEMPLO REAL ==================== -->
  <g transform="translate(350, 700)">
    <text x="0" y="-50" text-anchor="middle" fill="#FF69B4" font-size="16" font-weight="bold">
      3. Ejemplo: "El gato duerme"
    </text>
    
    <!-- Tokens -->
    <g font-family="monospace" font-size="11">
      <text x="-250" y="-20" fill="#FFD700">Token:</text>
      <text x="-250" y="0" fill="white">"El"</text>
      <text x="-150" y="0" fill="white">"gato"</text>
      <text x="-50" y="0" fill="white">"duerme"</text>
    </g>
    
    <!-- Matrices Q, K, V (simplificadas) -->
    <g transform="translate(-280, 20)">
      <text x="0" y="0" fill="#FF6B6B" font-size="10" font-weight="bold">Q (Query):</text>
      <text x="0" y="15" fill="#aaa" font-size="9">"¿Qué busco?"</text>
      <text x="0" y="30" fill="#888" font-size="8">[0.2, 0.8, 0.1]</text>
    </g>
    
    <g transform="translate(-100, 20)">
      <text x="0" y="0" fill="#32CD32" font-size="10" font-weight="bold">K (Key):</text>
      <text x="0" y="15" fill="#aaa" font-size="9">"¿Qué ofrezco?"</text>
      <text x="0" y="30" fill="#888" font-size="8">[0.3, 0.7, 0.2]</text>
    </g>
    
    <g transform="translate(80, 20)">
      <text x="0" y="0" fill="#4ECDC4" font-size="10" font-weight="bold">V (Value):</text>
      <text x="0" y="15" fill="#aaa" font-size="9">"¿Qué entrego?"</text>
      <text x="0" y="30" fill="#888" font-size="8">[animal, peludo, duerme]</text>
    </g>
    
    <!-- Resultado -->
    <g transform="translate(-280, 70)">
      <rect x="0" y="0" width="500" height="40" fill="#2d3748" rx="8"/>
      <text x="250" y="15" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold">Resultado: "gato" recibe información de "duerme" (peso: 0.85)</text>
      <text x="250" y="30" text-anchor="middle" fill="#aaa" font-size="9">El modelo sabe que "gato" es el que "duerme"</text>
    </g>
  </g>
  
  <!-- ==================== RESUMEN ==================== -->
  <g transform="translate(600, 820)">
    <rect x="-500" y="-20" width="1000" height="60" fill="#0d1117" stroke="#FFD700" stroke-width="2" rx="10"/>
    <text x="0" y="10" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      La atención NO se "guarda" como una cosa separada
    </text>
    <text x="0" y="30" text-anchor="middle" fill="#aaa" font-size="11">
      Se CALCULA dinámicamente cada vez que procesas texto, usando los pesos Q, K, V que SÍ están guardados
    </text>
  </g>
</svg>
