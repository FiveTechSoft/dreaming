<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <radialGradient id="sphereGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.1"/>
    </radialGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="1400" height="900" fill="url(#bg)"/>
  
  <!-- Título -->
  <text x="700" y="40" text-anchor="middle" fill="white" font-size="28" font-weight="bold">
    Geometría de las Perspectivas
  </text>
  <text x="700" y="70" text-anchor="middle" fill="#4ECDC4" font-size="14">
    "Cada prompt es una tangente al manifold"
  </text>
  
  <!-- ==================== ESFERA DE POSIBILIDADES ==================== -->
  <g transform="translate(400, 450)">
    <text x="0" y="-250" text-anchor="middle" fill="#FFD700" font-size="18" font-weight="bold">
      Espacio Tangente (Esfera de Posibilidades)
    </text>
    
    <!-- Esfera grande (representación 2D) -->
    <circle cx="0" cy="0" r="180" fill="url(#sphereGrad)" stroke="#4ECDC4" stroke-width="2"/>
    
    <!-- Punto actual en el manifold -->
    <circle cx="0" cy="0" r="15" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">TÚ</text>
    <text x="0" y="30" text-anchor="middle" fill="#FFD700" font-size="10">Punto actual</text>
    
    <!-- Tangentes (direcciones posibles) -->
    <!-- Filosofía -->
    <line x1="0" y1="0" x2="-120" y2="-120" stroke="#9370DB" stroke-width="3"/>
    <circle cx="-120" cy="-120" r="12" fill="#9370DB" filter="url(#glow)"/>
    <text x="-120" y="-115" text-anchor="middle" fill="white" font-size="8" font-weight="bold">FIL</text>
    
    <!-- Práctica -->
    <line x1="0" y1="0" x2="120" y2="-120" stroke="#FFA500" stroke-width="3"/>
    <circle cx="120" cy="-120" r="12" fill="#FFA500" filter="url(#glow)"/>
    <text x="120" y="-115" text-anchor="middle" fill="white" font-size="8" font-weight="bold">PRA</text>
    
    <!-- Creativa -->
    <line x1="0" y1="0" x2="150" y2="30" stroke="#FF69B4" stroke-width="3"/>
    <circle cx="150" cy="30" r="12" fill="#FF69B4" filter="url(#glow)"/>
    <text x="150" y="35" text-anchor="middle" fill="white" font-size="8" font-weight="bold">CRE</text>
    
    <!-- Estoica -->
    <line x1="0" y1="0" x2="-150" y2="30" stroke="#00CED1" stroke-width="3"/>
    <circle cx="-150" cy="30" r="12" fill="#00CED1" filter="url(#glow)"/>
    <text x="-150" y="35" text-anchor="middle" fill="white" font-size="8" font-weight="bold">EST</text>
    
    <!-- Espiritual -->
    <line x1="0" y1="0" x2="0" y2="-170" stroke="#FFD700" stroke-width="3"/>
    <circle cx="0" cy="-170" r="12" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="-165" text-anchor="middle" fill="#0a0a2e" font-size="8" font-weight="bold">ESPI</text>
    
    <!-- Auténtica -->
    <line x1="0" y1="0" x2="0" y2="170" stroke="#32CD32" stroke-width="3"/>
    <circle cx="0" cy="170" r="12" fill="#32CD32" filter="url(#glow)"/>
    <text x="0" y="175" text-anchor="middle" fill="#0a0a2e" font-size="8" font-weight="bold">AUT</text>
    
    <!-- Analítica -->
    <line x1="0" y1="0" x2="-100" y2="130" stroke="#FF6347" stroke-width="3"/>
    <circle cx="-100" cy="130" r="12" fill="#FF6347" filter="url(#glow)"/>
    <text x="-100" y="135" text-anchor="middle" fill="white" font-size="8" font-weight="bold">ANA</text>
    
    <!-- Lírica -->
    <line x1="0" y1="0" x2="100" y2="130" stroke="#DDA0DD" stroke-width="3"/>
    <circle cx="100" cy="130" r="12" fill="#DDA0DD" filter="url(#glow)"/>
    <text x="100" y="135" text-anchor="middle" fill="white" font-size="8" font-weight="bold">LIR</text>
    
    <!-- Círculo de magnitud constante -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="5,5"/>
  </g>
  
  <!-- ==================== FÓRMULA ==================== -->
  <g transform="translate(1050, 300)">
    <rect x="-200" y="-50" width="400" height="200" fill="#1a1a2e" stroke="#FFD700" stroke-width="2" rx="15"/>
    
    <text x="0" y="-20" text-anchor="middle" fill="#FFD700" font-size="14" font-weight="bold">
      Espacio Tangente
    </text>
    
    <text x="0" y="10" text-anchor="middle" fill="white" font-size="12">
      T_pM = {todas las tangentes en p}
    </text>
    
    <text x="0" y="40" text-anchor="middle" fill="#4ECDC4" font-size="11">
      Dimensión = 1152 (embedding dim)
    </text>
    
    <text x="0" y="65" text-anchor="middle" fill="#aaa" font-size="10">
      Cada dirección = una perspectiva
    </text>
    
    <text x="0" y="90" text-anchor="middle" fill="#FF69B4" font-size="10">
      Total perspectivas = infinitas
    </text>
    
    <text x="0" y="120" text-anchor="middle" fill="#aaa" font-size="9">
      (pero solo ~100-1000 son "distingibles")
    </text>
  </g>
  
  <!-- ==================== EJEMPLO ==================== -->
  <g transform="translate(1050, 580)">
    <rect x="-200" y="-50" width="400" height="180" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="2" rx="15"/>
    
    <text x="0" y="-20" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold">
      Ejemplo: "Jesus de Nazareth"
    </text>
    
    <text x="0" y="10" text-anchor="middle" fill="white" font-size="11">
      Tangente: [sabiduría, fe, amor, divinidad]
    </text>
    
    <text x="0" y="35" text-anchor="middle" fill="#aaa" font-size="10">
      Magnitud: ||v|| = 1.0 (normalizada)
    </text>
    
    <text x="0" y="60" text-anchor="middle" fill="#aaa" font-size="10">
      Direcciones cercanas:
    </text>
    
    <text x="-180" y="85" fill="#9370DB" font-size="9">• "Dios" → similar</text>
    <text x="-180" y="100" fill="#FF69B4" font-size="9">• "Buda" → ortogonal</text>
    <text x="0" y="85" fill="#FFA500" font-size="9">• "Profeta" → cercana</text>
    <text x="0" y="100" fill="#00CED1" font-size="9">• "Maestro" → cercana</text>
  </g>
  
  <!-- ==================== CONTADOR ==================== -->
  <g transform="translate(400, 800)">
    <rect x="-350" y="-30" width="700" height="70" fill="#0d1117" stroke="#FF69B4" stroke-width="2" rx="15"/>
    
    <text x="0" y="-5" text-anchor="middle" fill="#FF69B4" font-size="14" font-weight="bold">
      Total de Perspectivas
    </text>
    
    <text x="0" y="25" text-anchor="middle" fill="white" font-size="12">
      <tspan fill="#FFD700">1152</tspan> dimensiones × <tspan fill="#4ECDC4">infinitas</tspan> magnitudes = <tspan fill="#FF69B4">infinitas</tspan> perspectivas
    </text>
  </g>
</svg>
