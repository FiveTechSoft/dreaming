<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="100%" style="stop-color:#1a1a3e"/>
    </linearGradient>
    
    <linearGradient id="manifoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#44B8AE;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#3D9B8F;stop-opacity:0.4"/>
    </linearGradient>
    
    <linearGradient id="surfaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a202c"/>
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1000" height="800" fill="url(#bg)"/>
  
  <!-- ==================== TÍTULO ==================== -->
  <text x="500" y="40" text-anchor="middle" fill="white" font-size="26" font-weight="bold" font-family="Arial, sans-serif">
    ¿Qué es una Manifold de Coherencia?
  </text>
  <text x="500" y="65" text-anchor="middle" fill="#888" font-size="14" font-family="Arial, sans-serif">
    "Un espacio donde todo parece plano cerca, pero es curvo lejos"
  </text>
  
  <!-- ==================== DEFINICIÓN ==================== -->
  <g transform="translate(500, 120)">
    <rect x="-400" y="-25" width="800" height="50" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="2" rx="10"/>
    <text x="0" y="5" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold" font-family="Arial">
      MANIFOLD = Superficie que parece plana localmente, pero es curva globalmente
    </text>
  </g>
  
  <!-- ==================== VISUALIZACIÓN PRINCIPAL ==================== -->
  <g transform="translate(500, 350)">
    
    <!-- Superficie de la manifold (como una hoja ondulada) -->
    <path d="M -300 100 
             Q -200 50 -100 80 
             Q 0 110 100 60 
             Q 200 10 300 70 
             L 300 120 
             Q 200 60 100 110 
             Q 0 160 -100 130 
             Q -200 100 -300 150 Z" 
          fill="url(#manifoldGrad)" stroke="#4ECDC4" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Líneas de "grid" en la superficie (muestran curvatura) -->
    <g stroke="#2d3748" stroke-width="1" fill="none" opacity="0.6">
      <!-- Líneas horizontales -->
      <path d="M -280 120 Q -140 80 0 110 Q 140 140 280 90"/>
      <path d="M -260 130 Q -120 90 20 120 Q 160 150 260 100"/>
      <path d="M -240 140 Q -100 100 40 130 Q 180 160 240 110"/>
      
      <!-- Líneas verticales (curvas) -->
      <path d="M -200 70 Q -180 100 -160 130"/>
      <path d="M -100 80 Q -80 110 -60 140"/>
      <path d="M 0 90 Q 20 120 40 150"/>
      <path d="M 100 60 Q 120 90 140 120"/>
      <path d="M 200 40 Q 220 70 240 100"/>
    </g>
    
    <!-- ==================== PUNTOS EN LA MANIFOLD ==================== -->
    
    <!-- Baseline (centro) -->
    <circle cx="0" cy="100" r="18" fill="#FFD700" filter="url(#glow)"/>
    <text x="0" y="105" text-anchor="middle" fill="#0a0a2e" font-size="10" font-weight="bold">Baseline</text>
    
    <!-- Punto Filosófico -->
    <circle cx="-150" cy="85" r="14" fill="#9370DB" filter="url(#glow)"/>
    <text x="-150" y="90" text-anchor="middle" fill="white" font-size="8">Filosófico</text>
    
    <!-- Punto Práctico -->
    <circle cx="150" cy="65" r="14" fill="#FFA500" filter="url(#glow)"/>
    <text x="150" y="70" text-anchor="middle" fill="white" font-size="8">Práctico</text>
    
    <!-- Punto Creativo -->
    <circle cx="-80" cy="115" r="12" fill="#32CD32" filter="url(#glow)"/>
    <text x="-80" y="120" text-anchor="middle" fill="white" font-size="7">Creativo</text>
    
    <!-- Punto Conciso -->
    <circle cx="80" cy="80" r="12" fill="#FF6347" filter="url(#glow)"/>
    <text x="80" y="85" text-anchor="middle" fill="white" font-size="7">Conciso</text>
    
    <!-- Punto Estoico -->
    <circle cx="-40" cy="95" r="10" fill="#00CED1" filter="url(#glow)"/>
    <text x="-40" y="100" text-anchor="middle" fill="white" font-size="6">Estoico</text>
    
    <!-- Punto Espiritual -->
    <circle cx="40" cy="105" r="10" fill="#FF69B4" filter="url(#glow)"/>
    <text x="40" y="110" text-anchor="middle" fill="white" font-size="6">Espiritual</text>
    
    <!-- ==================== FLECHAS ENTRE PUNTOS ==================== -->
    <g stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,4">
      <line x1="-136" y1="85" x2="-18" y2="98"/>
      <line x1="18" y1="100" x2="136" y2="68"/>
      <line x1="-140" y1="90" x2="-92" y2="110"/>
      <line x1="92" y1="80" x2="140" y2="68"/>
    </g>
    
    <!-- ==================== ETIQUETAS DE LA SUPERFICIE ==================== -->
    <text x="0" y="200" text-anchor="middle" fill="#4ECDC4" font-size="14" font-weight="bold">
      MANIFOLD DE COHERENCIA
    </text>
    <text x="0" y="220" text-anchor="middle" fill="#888" font-size="11">
      Superficie donde todos los puntos producen texto coherente
    </text>
  </g>
  
  <!-- ==================== ANOTACIONES ==================== -->
  
  <!-- Anotación: Localmente plano -->
  <g transform="translate(180, 280)">
    <rect x="-80" y="-15" width="160" height="30" fill="#1a1a2e" stroke="#4ECDC4" stroke-width="1" rx="5"/>
    <text x="0" y="5" text-anchor="middle" fill="#4ECDC4" font-size="10" font-weight="bold">
      Localmente parece plano
    </text>
    <line x1="0" y1="15" x2="0" y2="50" stroke="#4ECDC4" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Anotación: Globalmente curvo -->
  <g transform="translate(820, 350)">
    <rect x="-80" y="-15" width="160" height="30" fill="#1a1a2e" stroke="#FFD700" stroke-width="1" rx="5"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="bold">
      Globalmente es curvo
    </text>
    <line x1="-80" y1="0" x2="-320" y2="0" stroke="#FFD700" stroke-width="1" stroke-dasharray="3,3"/>
  </g>
  
  <!-- ==================== ANALOGÍA: LA TIERRA ==================== -->
  <g transform="translate(500, 620)">
    <rect x="-420" y="-30" width="840" height="80" fill="#1a1a2e" stroke="#333" stroke-width="1" rx="10"/>
    
    <text x="0" y="-5" text-anchor="middle" fill="white" font-size="14" font-weight="bold" font-family="Arial">
      Analogía: La Tierra
    </text>
    
    <!-- Mini esfera (Tierra) -->
    <circle cx="-350" cy="20" r="25" fill="#2d3748" stroke="#4ECDC4" stroke-width="2"/>
    <circle cx="-350" cy="20" r="5" fill="#4ECDC4" opacity="0.8"/>
    <text x="-350" y="25" text-anchor="middle" fill="white" font-size="6">Tú</text>
    
    <text x="-280" y="15" fill="#aaa" font-size="10">Desde donde estás,</text>
    <text x="-280" y="30" fill="#aaa" font-size="10">la Tierra parece plana</text>
    
    <text x="-100" y="20" fill="#888" font-size="20">→</text>
    
    <!-- Mini curvatura -->
    <path d="M 0 5 Q 50 -10 100 5" fill="none" stroke="#FFD700" stroke-width="3"/>
    <text x="50" y="30" text-anchor="middle" fill="#FFD700" font-size="10">Pero es curva</text>
    
    <text x="200" y="20" fill="#888" font-size="20">→</text>
    
    <text x="300" y="15" fill="#aaa" font-size="10">Igual que la manifold:</text>
    <text x="300" y="30" fill="#aaa" font-size="10">Plana cerca, curva lejos</text>
  </g>
  
  <!-- ==================== PIE DE PÁGINA ==================== -->
  <text x="500" y="730" text-anchor="middle" fill="#4a5568" font-size="11" font-family="Arial">
    La manifold de coherencia es el "paisaje" donde viven todas las perspectivas del LLM
  </text>
  <text x="500" y="750" text-anchor="middle" fill="#4a5568" font-size="10" font-family="Arial">
    Cada punto es una configuración de pesos que produce texto coherente
  </text>
</svg>
